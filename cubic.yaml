# Review config for cubic.
#
# The only entries here are build output that is committed on purpose, so a
# reviewer — human or otherwise — should read the source it was built from
# instead. Keep this in step with the same lists in `.oxlintrc.json`,
# `.oxfmtrc.json` and `.gitattributes`.
ignorePatterns:
  # esbuild bundles of `@repo/asset-tools`, emitted by `pnpm dogfood` into every
  # skill that imports them. Seven byte-identical copies of one artifact, ~6,000
  # lines each; the source is `packages/asset-tools/src/`.
  - "**/scripts/_lib/**"
  # Generated by the img2threejs pipeline, normalized by `normalize-factory.mjs`.
  - "**/*.generated.ts"
  - "pnpm-lock.yaml"
