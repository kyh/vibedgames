packages:
  - apps/*
  - games/*
  - packages/*

catalog:
  "@cloudflare/vite-plugin": ^1.53.1
  "@cloudflare/workers-types": ^5.20260821.1
  "@kyh/tsconfig": ^1.2.0
  "@orpc/client": ^1.15.0
  "@orpc/server": ^1.15.0
  "@orpc/tanstack-query": ^1.15.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-router": ^1.170.31
  "@tanstack/react-router-ssr-query": ^1.167.1
  "@tanstack/react-start": ^1.168.48
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  "@vitejs/plugin-react-swc": ^4.3.1
  globals: ^17.6.0
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.2.2
  vite-tsconfig-paths: ^6.1.1
  wrangler: ^4.125.0
  zod: ^4.4.3

linkWorkspacePackages: true

publicHoistPattern:
  - "@cloudflare/workers-types"
# Install native deps for every platform so bun can cross-compile the factory
# CLI binaries (scripts/build.ts) from any host.
supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - darwin
    - linux
    - win32
