packages:
  - apps/*
  - games/*
  - packages/*

catalog:
  "@cloudflare/vite-plugin": ^1.56.0
  "@cloudflare/workers-types": ^5.20260918.1
  "@kyh/tsconfig": ^1.2.0
  "@orpc/client": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.103.1
  "@tanstack/react-router": ^1.170.38
  "@tanstack/react-router-ssr-query": ^1.167.3
  "@tanstack/react-start": ^1.168.56
  "@types/node": ^26.6.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitejs/plugin-react-swc": ^4.3.1
  cn: ^0.3.0
  globals: ^17.6.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.3.0
  vite-tsconfig-paths: ^6.1.1
  wrangler: ^4.135.0
  zod: ^4.6.5

linkWorkspacePackages: true

publicHoistPattern:
  - "@cloudflare/workers-types"
# Install native deps for every platform so bun can cross-compile the factory
# CLI binaries (scripts/build.ts) from any host.
supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - darwin
    - linux
    - win32

allowBuilds:
  "@swc/core": true
  "@tailwindcss/oxide": true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  react-hook-form: "^7.72.1"
  # The 1.7.2 plugins accept any 1.7.x core as a peer; left alone they resolve a
  # second, issuer-less 1.7.5 instance beside better-auth's own.
  "@better-auth/core": 1.7.2

# apps/games/tests/worker.mjs drives Miniflare through the top-level single-worker
# options that 5.x replaces with a per-worker `config` object. npm's `latest` tag
# already points at a 5.x alpha, so `pnpm up --latest` reaches it unless told not to.
updateConfig:
  ignoreDependencies:
    - miniflare
    # better-auth 1.7.3+ drops `account.issuer`, which prod D1 holds as NOT NULL
    # inside the unique `(issuer, account_id)` index: every account insert would
    # fail. Pinned exact at 1.7.2 until the column is migrated off.
    - better-auth
    - "@better-auth/*"
