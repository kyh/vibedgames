packages:
  - apps/*
  - games/*
  - packages/*

catalog:
  "@cloudflare/vite-plugin": ^1.64.0
  "@cloudflare/workers-types": ^5.20261016.1
  "@kyh/tsconfig": ^1.3.0
  "@orpc/client": 2.0.0-beta.45
  "@orpc/contract": 2.0.0-beta.45
  "@orpc/json-schema": 2.0.0-beta.45
  "@orpc/openapi": 2.0.0-beta.45
  "@orpc/server": 2.0.0-beta.45
  "@orpc/tanstack-query": 2.0.0-beta.45
  "@orpc/zod": 2.0.0-beta.45
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.3
  "@tanstack/react-router": ^1.170.45
  "@tanstack/react-router-ssr-query": ^1.167.3
  "@tanstack/react-start": ^1.169.3
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitejs/plugin-react-swc": ^4.3.1
  # exact: a beta, whose config API moves between releases
  cf: 1.0.0-beta.12
  cn: ^0.4.0
  globals: ^17.6.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.3.4
  vite-tsconfig-paths: ^6.1.1
  wrangler: ^4.151.1
  zod: ^4.6.7

linkWorkspacePackages: true

publicHoistPattern:
  - "@cloudflare/workers-types"
allowBuilds:
  "@swc/core": true
  "@tailwindcss/oxide": true
  core-js: true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  react-hook-form: "^7.72.1"
  # The 1.7.2 plugins accept any 1.7.x core as a peer; left alone they resolve a
  # second, issuer-less 1.7.5 instance beside better-auth's own.
  "@better-auth/core": 1.7.2

# apps/games/tests/worker.mjs drives Miniflare through the top-level single-worker
# options that 5.x replaces with a per-worker `config` object. npm's `latest` tag
# already points at a 5.x alpha, so `pnpm up --latest` reaches it unless told not to.
updateConfig:
  ignoreDependencies:
    - miniflare
    # better-auth 1.7.3+ drops `account.issuer`, which prod D1 holds as NOT NULL
    # inside the unique `(issuer, account_id)` index: every account insert would
    # fail. Pinned exact at 1.7.2 until the column is migrated off.
    - better-auth
    - "@better-auth/*"
# TanStack Start 1.0 (react-start 1.169.1) and oRPC 2.0.0-beta.45, published inside the
# release-age window; drop these once they are a day old and a fresh install passes without them.
minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.44"
  - "@tanstack/react-start-client@1.168.42"
  - "@tanstack/react-start-rsc@0.1.62"
  - "@tanstack/react-start-server@1.167.49"
  - "@tanstack/react-start@1.169.1"
  - "@tanstack/router-core@1.171.37"
  - "@tanstack/router-generator@1.167.43"
  - "@tanstack/router-plugin@1.168.45"
  - "@tanstack/start-client-core@1.170.37"
  - "@tanstack/start-plugin-core@1.171.52"
  - "@tanstack/start-server-core@1.169.42"
  - "@tanstack/start-storage-context@1.167.39"
  - "@orpc/client@2.0.0-beta.45"
  - "@orpc/contract@2.0.0-beta.45"
  - "@orpc/json-schema@2.0.0-beta.45"
  - "@orpc/openapi@2.0.0-beta.45"
  - "@orpc/server@2.0.0-beta.45"
  - "@orpc/shared@2.0.0-beta.45"
  - "@orpc/tanstack-query@2.0.0-beta.45"
  - "@orpc/zod@2.0.0-beta.45"
