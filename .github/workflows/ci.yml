name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # Build leads, unlike the house reference: the TanStack Start vite plugin generates
      # apps/web/src/routeTree.gen.ts (gitignored) during build, and `tsc --noEmit` needs it.
      # turbo's typecheck task depends on `^build` — upstream packages only, not the app's
      # own — so on a bare checkout typecheck-before-build has no route tree to read.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test
