<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ae8261" />
    <title>Tabletop Turbo</title>
    <meta
      name="description"
      content="Eight toy cars on a table with no walls. Fire your bumper, knock the others off."
    />
    <meta property="og:title" content="Tabletop Turbo" />
    <meta
      property="og:description"
      content="Car sumo on a tabletop. Punch with your bumper, knock them over the edge."
    />
    <style>
      :root {
        --me: #18bfb4;
        --ink: #fff0c8;
        --dim: #c3b49c;
        --plate: #2a2836;
        --edge: #151520;
        --lip: #565664;
        --hazard: #f4b93a;
        --bad: #ff6a55;
        --good: #7ddc5a;
        --font: "Silkscreen", "Courier New", monospace;
        --u: 2px;
        --top: env(safe-area-inset-top, 0px);
        --left: env(safe-area-inset-left, 0px);
        --right: env(safe-area-inset-right, 0px);
        --bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ae8261;
        color: var(--ink);
        font-family: var(--font);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
        position: absolute;
        image-rendering: pixelated;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .panel {
        background: var(--plate);
        border: var(--u) solid var(--edge);
        box-shadow:
          inset 0 var(--u) 0 var(--lip),
          0 calc(var(--u) * 2) 0 rgba(30, 29, 45, 0.4);
      }
      .label {
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #hud,
      #results,
      #title {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #hud[data-on="0"],
      #results[data-on="0"],
      #title[data-on="0"] {
        display: none;
      }

      #clock {
        position: absolute;
        top: calc(10px + var(--top));
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 14px 6px;
        text-align: center;
      }
      #clock b {
        display: block;
        font-size: 26px;
        line-height: 1;
        font-weight: 700;
      }
      #clock[data-urgent="1"] {
        border-color: var(--hazard);
      }
      #clock[data-urgent="1"] b {
        color: var(--hazard);
      }

      #me {
        position: absolute;
        top: calc(10px + var(--top));
        left: calc(10px + var(--left));
        padding: 4px 12px 6px;
        border-left: calc(var(--u) * 3) solid var(--me);
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      #me b {
        font-size: 30px;
        line-height: 1;
        font-weight: 700;
      }
      #me b[data-bump="1"] {
        animation: bump 0.3s steps(4);
      }
      #place {
        font-size: 14px;
        color: var(--hazard);
      }
      @keyframes bump {
        0% {
          transform: scale(1.6);
          color: var(--hazard);
        }
        100% {
          transform: scale(1);
        }
      }

      #feed {
        position: absolute;
        top: calc(64px + var(--top));
        left: calc(10px + var(--left));
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
      }
      #feed div {
        padding: 2px 6px;
        background: rgba(30, 29, 45, 0.85);
        width: max-content;
        animation: feed 4.5s steps(18) forwards;
      }
      #feed i {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 0 4px 0 0;
      }
      #feed em {
        font-style: normal;
        color: var(--dim);
        margin: 0 5px;
      }
      @keyframes feed {
        0%,
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      #board {
        position: absolute;
        top: calc(10px + var(--top));
        right: calc(10px + var(--right));
        padding: 4px 0;
        min-width: 132px;
        font-size: 11px;
      }
      #board div {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
      }
      #board div[data-me="1"] {
        background: var(--edge);
      }
      #board div[data-out="1"] span {
        opacity: 0.45;
      }
      #board i {
        width: 8px;
        height: 8px;
        flex: none;
      }
      #board span {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        max-width: 96px;
      }
      #board b {
        font-weight: 700;
      }

      #dash {
        position: absolute;
        left: 50%;
        bottom: calc(14px + var(--bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;
        gap: 6px;
      }
      .touch #board {
        right: calc(64px + var(--right));
      }
      @media (max-width: 520px) {
        .touch #board {
          top: calc(62px + var(--top));
          right: calc(10px + var(--right));
        }
      }
      .touch #dash {
        bottom: auto;
        top: calc(62px + var(--top));
      }
      .meter {
        padding: 4px 8px 6px;
        min-width: 104px;
      }
      .meter .bar {
        height: 8px;
        margin-top: 3px;
        background: #1e1d2d;
        border: var(--u) solid var(--edge);
      }
      .meter .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ink);
      }
      #punch[data-ready="1"] .bar i {
        background: var(--hazard);
      }
      #punch[data-ready="1"] {
        border-color: var(--hazard);
      }
      #boost .bar i {
        background: var(--me);
      }
      #boost[data-low="1"] .bar i {
        background: var(--dim);
      }
      #item {
        padding: 4px 10px 6px;
        min-width: 92px;
        text-align: center;
      }
      #item[data-kind=""] {
        display: none;
      }
      #item b {
        display: block;
        font-size: 13px;
        font-weight: 700;
      }

      #banner {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px 8px;
        font-size: 22px;
        font-weight: 700;
        white-space: nowrap;
        background: var(--plate);
        border: var(--u) solid var(--ink);
        box-shadow:
          inset 0 var(--u) 0 var(--lip),
          0 calc(var(--u) * 2) 0 rgba(30, 29, 45, 0.4);
        display: none;
      }
      #banner[data-on="1"] {
        display: block;
        animation: slam 0.2s steps(4);
      }
      #banner[data-tone="good"] {
        color: var(--good);
        border-color: var(--good);
      }
      #banner[data-tone="bad"] {
        color: var(--bad);
        border-color: var(--bad);
      }
      #banner[data-tone="warn"] {
        color: var(--hazard);
        border-color: var(--hazard);
      }
      @keyframes slam {
        0% {
          transform: translateX(-50%) scale(1.5);
        }
        100% {
          transform: translateX(-50%) scale(1);
        }
      }

      #count {
        position: absolute;
        top: 36%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 96px;
        font-weight: 700;
        color: var(--ink);
        text-shadow:
          4px 0 0 #1e1d2d,
          -4px 0 0 #1e1d2d,
          0 4px 0 #1e1d2d,
          0 -4px 0 #1e1d2d,
          0 10px 0 rgba(0, 0, 0, 0.5);
      }
      #count[data-go="1"] {
        color: var(--hazard);
      }
      #count b {
        display: block;
        animation: slamc 0.25s steps(5);
      }
      @keyframes slamc {
        0% {
          transform: scale(1.8);
        }
        100% {
          transform: scale(1);
        }
      }

      #net {
        position: absolute;
        left: calc(10px + var(--left));
        bottom: calc(8px + var(--bottom));
        font-size: 10px;
        color: var(--dim);
      }

      #pops {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #pops span {
        position: absolute;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
        transform: translate(-50%, -50%);
        text-shadow:
          2px 0 0 #1e1d2d,
          -2px 0 0 #1e1d2d,
          0 2px 0 #1e1d2d,
          0 -2px 0 #1e1d2d;
        animation: pop 0.9s steps(12) forwards;
      }
      @keyframes pop {
        0% {
          margin-top: 0;
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        100% {
          margin-top: -44px;
          opacity: 0;
        }
      }

      #results {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 29, 45, 0.45);
      }
      #sheet {
        padding: 14px 18px 16px;
        min-width: min(320px, 88vw);
        border-color: var(--ink);
      }
      #sheet h2 {
        margin: 0 0 2px;
        font-size: 26px;
        text-align: center;
      }
      #sheet h2[data-won="1"] {
        color: var(--hazard);
      }
      #results-rows {
        margin: 10px 0;
        font-size: 14px;
      }
      #results-rows div {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 6px;
      }
      #results-rows div[data-me="1"] {
        background: var(--edge);
      }
      #results-rows i {
        width: 10px;
        height: 10px;
        flex: none;
      }
      #results-rows em {
        font-style: normal;
        color: var(--dim);
        width: 22px;
      }
      #results-rows span {
        flex: 1;
      }
      #results-next {
        text-align: center;
      }

      #title {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: calc(16px + var(--top)) 16px calc(16px + var(--bottom));
        background: linear-gradient(rgba(30, 29, 45, 0.1), rgba(30, 29, 45, 0.6));
      }
      #title h1 {
        margin: 0;
        font-size: clamp(34px, 9vw, 76px);
        line-height: 0.9;
        text-align: center;
        font-weight: 700;
        color: var(--ink);
        text-shadow:
          4px 0 0 #1e1d2d,
          -4px 0 0 #1e1d2d,
          0 4px 0 #1e1d2d,
          0 -4px 0 #1e1d2d,
          0 10px 0 rgba(0, 0, 0, 0.55);
      }
      #title h1 em {
        display: block;
        font-style: normal;
        color: var(--hazard);
      }
      #tag {
        font-size: clamp(12px, 2.6vw, 18px);
        padding: 4px 12px 6px;
      }
      #rules {
        list-style: none;
        margin: 0;
        padding: 8px 14px;
        font-size: clamp(10px, 2vw, 13px);
        display: grid;
        gap: 4px;
        max-width: 520px;
      }
      #rules b {
        color: var(--hazard);
        margin-right: 8px;
        font-weight: 700;
      }
      #start {
        pointer-events: auto;
        cursor: pointer;
        padding: 8px 34px 12px;
        font-size: clamp(22px, 5vw, 34px);
        font-weight: 700;
        color: #1e1d2d;
        background: var(--hazard);
        border: var(--u) solid #fff6b0;
        box-shadow: 0 6px 0 #6b4a00;
      }
      #start:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #6b4a00;
      }
      #controls {
        padding: 6px 12px 8px;
        font-size: clamp(10px, 2vw, 12px);
        color: var(--dim);
        text-align: center;
        line-height: 1.6;
      }
      #controls b {
        color: var(--ink);
        font-weight: 400;
      }

      @media (max-width: 700px), (max-height: 430px) {
        #board {
          font-size: 10px;
          min-width: 100px;
        }
        #board div:nth-child(n + 5):not([data-me="1"]) {
          display: none;
        }
        #board span {
          max-width: 64px;
        }
        #clock b {
          font-size: 20px;
        }
        #me b {
          font-size: 22px;
        }
        #feed {
          top: calc(52px + var(--top));
          font-size: 10px;
        }
        #banner {
          font-size: 15px;
        }
        #count {
          font-size: 64px;
        }
        .meter {
          min-width: 76px;
        }
      }
      @media (max-height: 430px) {
        #title {
          gap: 6px;
        }
        #rules {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #banner[data-on="1"],
        #count b,
        #me b[data-bump="1"] {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" data-on="0">
      <div id="me" class="panel">
        <b id="score">0</b>
        <span id="place">1ST</span>
      </div>
      <div id="feed" aria-hidden="true"></div>
      <div id="clock" class="panel" data-urgent="0">
        <span id="round" class="label">Round 1</span>
        <b id="time">1:30</b>
      </div>
      <div id="board" class="panel" aria-label="Scores"></div>
      <div id="banner" role="status" data-on="0"></div>
      <div id="count" aria-live="assertive"></div>
      <div id="dash">
        <div id="punch" class="panel meter" data-ready="1">
          <span class="label">Bumper</span>
          <div class="bar"><i></i></div>
        </div>
        <div id="boost" class="panel meter">
          <span class="label">Boost</span>
          <div class="bar"><i></i></div>
        </div>
        <div id="item" class="panel" data-kind="">
          <span class="label">Crate</span>
          <b id="item-name"></b>
        </div>
      </div>
      <div id="net"></div>
    </div>

    <div id="pops" aria-hidden="true"></div>

    <div id="results" data-on="0">
      <div id="sheet" class="panel">
        <h2 id="results-title">ROUND OVER</h2>
        <div id="results-rows"></div>
        <div id="results-next" class="label"></div>
      </div>
    </div>

    <div id="title" data-on="1">
      <h1>TABLETOP<em>TURBO</em></h1>
      <span id="tag" class="panel">Knock them off the table</span>
      <ul id="rules" class="panel">
        <li><b>1</b>Fire your bumper to punch whoever is in front of you.</li>
        <li><b>2</b>Over the edge or into a hole is a point for you.</li>
        <li><b>3</b>Crates change your bumper. The board hits back.</li>
      </ul>
      <button id="start" type="button">PLAY</button>
      <div id="controls" class="panel"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
