<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Starfall</title>
    <meta
      name="description"
      content="Online multiplayer arena shooter. Drop in, level up, blast your friends among the stars."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #020617 url("bg.png") repeat;
        background-size: 10px 10px;
        color: #fff;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        cursor: crosshair;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: calc(16px + env(safe-area-inset-top, 0px))
          calc(20px + env(safe-area-inset-right, 0px)) 16px
          calc(20px + env(safe-area-inset-left, 0px));
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      #weapon {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.6;
      }
      #weaponbar {
        height: 2px;
        width: 0%;
        margin-top: 3px;
        background: #fff;
        transition: width 100ms linear;
      }
      #shield {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.8;
        margin-top: 4px;
        display: none;
      }
      #shieldrow {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #shieldtrack {
        position: relative;
        width: 70px;
        height: 3px;
        display: inline-block;
      }
      #shieldfill {
        position: absolute;
        left: 0;
        top: 0;
        height: 3px;
        width: 40px;
        background: #fff;
        transition: width 100ms linear;
      }
      #shieldos {
        position: absolute;
        left: 41px;
        top: 0;
        height: 3px;
        width: 0;
        background: #7dd3fc;
        transition: width 100ms linear;
      }
      /* low shield (<30): 6Hz blink */
      #shield.low #shieldfill {
        animation: shield-blink 167ms steps(1) infinite;
      }
      @keyframes shield-blink {
        50% {
          opacity: 0.25;
        }
      }
      #shieldmod {
        margin-top: 3px;
        display: none;
      }
      #shieldmodbar {
        height: 2px;
        width: 0%;
        margin-top: 2px;
        transition: width 100ms linear;
      }
      #boosts {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 4px;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
      #players {
        font-size: 11px;
        opacity: 0.5;
      }
      #hudright {
        text-align: right;
      }
      /* @repo/embed's mute/pause cluster mounts on touch devices only, and it
         claims the same top-right corner as this column. */
      .vg-touch-controls {
        --vg-touch-fg: #cfe0ff;
        --vg-touch-bg: rgba(3, 7, 22, 0.62);
        --vg-touch-bg-active: rgba(127, 178, 255, 0.24);
        --vg-touch-border: 1px solid rgba(127, 178, 255, 0.3);
        --vg-touch-radius: 3px;
      }
      body:has(.vg-touch-controls) #hudright {
        margin-top: 46px;
      }
      /* dir-006: persistent sector line — the ambient mid-game chase. */
      #sector {
        font-size: 11px;
        opacity: 0.55;
        margin-top: 4px;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
      }
      /* qa-019: mouse-drag is the core verb — HUD/overlay text must never
         highlight under a drag that strays across it. */
      #hud,
      #start,
      #overlay,
      #bossbar,
      #combo,
      #recap,
      #pulse {
        user-select: none;
        -webkit-user-select: none;
      }

      #bossbar {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: 44vw;
        /* Centred, so on a narrow phone it grows into the top-right corner the
           shared touch cluster owns — it overlapped the mute button by 7px at
           360px wide. Keep both halves clear of the reserved corner. */
        max-width: min(720px, calc(100vw - 2 * (var(--vg-touch-reserve, 0px) + 12px)));
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #bossbar[hidden],
      #recap[hidden],
      #pulse[hidden],
      #overlay[hidden] {
        display: none;
      }
      #bosslabel {
        margin-bottom: 5px;
        color: #ffaaa5;
        font:
          10px/1.4 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.16em;
        text-align: center;
      }
      #bossbar .track {
        height: 8px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 45, 45, 0.5);
      }
      #bosshp {
        height: 100%;
        width: 100%;
        background: #ff2d2d;
        box-shadow: 0 0 10px #ff2d2d;
        transition: width 120ms linear;
      }
      @media (max-width: 600px) {
        #bossbar {
          top: calc(122px + env(safe-area-inset-top, 0px));
          width: calc(100vw - 40px);
          max-width: none;
        }
      }
      #combo {
        position: fixed;
        top: calc(48px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        padding: 4px 14px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.2s ease;
        text-align: center;
      }
      #comboval {
        font-size: 14px;
        font-weight: 200;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
      }
      #combobar {
        height: 2px;
        width: 100%;
        margin-top: 3px;
        background: rgba(255, 255, 255, 0.8);
        transition: width 100ms linear;
      }
      #combo.pop {
        animation: combo-pop 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* dir-006 sector surfaces: recap banner (boundary, 10s) + standings
         pulse (rel 180/360, 5s). DOM like the bossbar — zero input capture;
         the scene only flips opacity + rewrites text. Gold = the shared-event
         family (BEACON_TINT #ffd166). */
      #recap {
        position: fixed;
        top: calc(96px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        width: min(420px, calc(100vw - 40px));
        box-sizing: border-box;
        padding: 12px 18px;
        background: rgba(5, 12, 27, 0.88);
        border: 1px solid rgba(255, 209, 102, 0.35);
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        font-variant-numeric: tabular-nums;
      }
      /* dir-009: the boundary beat earns ~20% more presence — a scale-in on
         entry (same 300ms as the fade, cubic-out) + one winner-row pop. Still
         non-blocking: pointer-events stay off, no shake, no input capture. */
      #recap.in {
        animation: recap-in 300ms cubic-bezier(0.33, 1, 0.68, 1);
      }
      #recap h2 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.15em;
      }
      #recap .row {
        font-size: 12px;
        letter-spacing: 1px;
        opacity: 0.95;
      }
      #recap .row {
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      #recap.in .row:first-of-type {
        animation: recap-row-pop 200ms 450ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .recap-best,
      .recap-handoff {
        margin-top: 5px;
        font:
          10px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.09em;
        color: #a1b5d6;
      }
      .recap-handoff {
        padding-top: 7px;
        margin-top: 8px;
        border-top: 1px solid rgba(255, 209, 102, 0.16);
        color: #ffd166;
      }
      @keyframes recap-in {
        from {
          transform: translateX(-50%) scale(1.12);
        }
        to {
          transform: translateX(-50%) scale(1);
        }
      }
      @keyframes recap-row-pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      #pulse {
        position: fixed;
        top: calc(88px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        padding: 3px 14px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 1px;
        opacity: 0;
        transition: opacity 0.25s ease;
        font-variant-numeric: tabular-nums;
      }
      @keyframes combo-pop {
        0% {
          transform: translateX(-50%) scale(1);
        }
        50% {
          transform: translateX(-50%) scale(1.15);
        }
        100% {
          transform: translateX(-50%) scale(1);
        }
      }

      /* Initial screen. The only place controls are taught — once play starts
         the field carries no instruction text. Removed from the DOM on start.
         Behind it a live cosmetic dogfight plays (see AttractBattle): the
         backdrop only dims/vignettes lightly so the battle reads clearly, with
         a darker radial pool pooled behind the centred text for legibility. */
      #start {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
        text-align: center;
        /* Layer 1: dark pool behind the text block (readability). Layer 2: a
           soft edge vignette. The centre-ring stays clear so ships read. */
        background:
          radial-gradient(
            ellipse 62% 42% at 50% 50%,
            rgba(2, 4, 14, 0.82),
            rgba(2, 4, 14, 0.34) 55%,
            rgba(2, 4, 14, 0) 74%
          ),
          radial-gradient(ellipse at 50% 50%, rgba(2, 4, 14, 0) 34%, rgba(2, 4, 14, 0.6) 100%);
        transition: opacity 0.28s ease;
        /* The keycap card below the wordmark is device-dependent, so the scene
           writes it (writeStartCopy) long after this markup paints. Painting
           the half-built column first made the centred title jump ~80px the
           moment the card landed — hold the whole overlay until it is whole. */
        opacity: 0;
      }
      #start.ready {
        opacity: 1;
      }
      #start.hide {
        opacity: 0;
        pointer-events: none;
      }
      #start h1 {
        margin: 0;
      }
      #start h1 img {
        display: block;
        width: clamp(300px, 58vw, 700px);
        height: auto;
        max-width: 88vw;
        filter: drop-shadow(0 0 26px rgba(90, 160, 255, 0.5));
        animation: title-flicker 4.5s ease-in-out infinite;
      }
      @keyframes title-flicker {
        0%,
        100% {
          filter: drop-shadow(0 0 26px rgba(90, 160, 255, 0.5));
        }
        48% {
          filter: drop-shadow(0 0 40px rgba(120, 180, 255, 0.75));
        }
        52% {
          filter: drop-shadow(0 0 14px rgba(90, 160, 255, 0.35));
        }
      }
      /* Hosts the grouped keycap rows built by src/pause-overlay.ts
         (buildControls) — same card the pause overlay renders. */
      #start-controls {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
        color: #9fb6e6;
      }
      #start-go {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7fb2ff;
        text-shadow: 0 0 14px rgba(90, 160, 255, 0.6);
        animation: start-pulse 1.6s ease-in-out infinite;
      }
      #trial-options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: 440px;
      }
      #trial-options span {
        width: 100%;
        color: #9fb6e6;
        font:
          10px ui-monospace,
          monospace;
        letter-spacing: 0.14em;
      }
      #trial-options a,
      #trial-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 14px;
        color: #d5e8ff;
        background: #09192ce6;
        border: 1px solid #365679;
        border-radius: 3px;
        text-decoration: none;
        font:
          12px ui-monospace,
          monospace;
      }
      #trial-options a:hover,
      #trial-actions a:hover {
        background: #183655;
      }
      #trial-options a:focus-visible,
      #trial-actions a:focus-visible {
        outline: 2px solid #b8e8ff;
        outline-offset: 3px;
      }
      #trial-card {
        position: fixed;
        z-index: 7;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: min(360px, calc(100vw - 32px));
        padding: 12px 16px;
        border: 1px solid #365679;
        border-left: 2px solid #80ceef;
        border-radius: 3px;
        background: #061222eb;
        color: #cde4ff;
        font:
          12px/1.5 ui-monospace,
          monospace;
        pointer-events: none;
      }
      #trial-card[hidden],
      #trial-actions[hidden] {
        display: none;
      }
      #trial-title {
        color: #a4e4ff;
        letter-spacing: 0.08em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      #trial-progress {
        margin-top: 5px;
        color: #88aac6;
      }
      #trial-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        pointer-events: auto;
      }
      @media (max-width: 600px) and (min-height: 561px) {
        #trial-card {
          top: calc(106px + env(safe-area-inset-top, 0px));
          bottom: auto;
        }
      }
      @media (max-height: 560px) {
        #start {
          gap: 10px;
          padding: 12px;
          overflow-y: auto;
        }
        #start h1 img {
          width: min(52vw, 360px);
          min-width: 0;
        }
        #trial-options {
          gap: 5px;
        }
        #trial-card {
          left: 16px;
          bottom: 12px;
          transform: none;
          width: 300px;
          padding: 8px 12px;
        }
      }
      @keyframes start-pulse {
        50% {
          opacity: 0.32;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #start h1 img {
          animation: none;
        }
        #start-go {
          animation: none;
        }
      }

      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        place-items: center;
        padding: 100px 20px 20px;
        box-sizing: border-box;
        opacity: 0;
      }
      #recovery-card {
        width: min(350px, 100%);
        box-sizing: border-box;
        padding: 20px;
        background: rgba(5, 12, 27, 0.92);
        border: 1px solid rgba(125, 211, 252, 0.36);
        border-top: 2px solid #7dd3fc;
        text-align: center;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
      }
      .recovery-kicker {
        font:
          10px/1.4 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.17em;
        color: #7dd3fc;
        margin-bottom: 8px;
      }
      #destroyed {
        font-size: 25px;
        font-weight: 300;
        letter-spacing: 0.18em;
      }
      #cause {
        margin-top: 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #b7c6df;
      }
      #hint {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.4;
        color: #b7c6df;
      }
      #hint:empty {
        display: none;
      }
      #countdown {
        margin-top: 16px;
        font-size: 13px;
        color: #e1f2ff;
        font-variant-numeric: tabular-nums;
      }
      #recovery-progress {
        height: 3px;
        margin: 8px 0 12px;
        background: rgba(125, 211, 252, 0.15);
      }
      #recovery-fill {
        height: 100%;
        background: #7dd3fc;
        transform: scaleX(0);
        transform-origin: left;
      }
      #recovery-loadout {
        color: #95abc9;
        font:
          10px/1.6 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.05em;
      }
      @media (max-width: 600px) {
        #hudright {
          max-width: 52%;
        }
        #sector {
          line-height: 1.5;
          letter-spacing: 0.04em;
        }
        #recap,
        #pulse {
          top: calc(168px + env(safe-area-inset-top, 0px));
        }
        #recap {
          padding: 10px 14px;
        }
        #pulse {
          width: max-content;
          max-width: calc(100vw - 60px);
          text-align: center;
        }
        #overlay {
          padding-top: 158px;
        }
      }
      @media (max-height: 450px) {
        #recovery-card {
          padding: 13px 18px;
        }
        #destroyed {
          font-size: 21px;
        }
        #countdown {
          margin-top: 10px;
        }
        #recap .row {
          line-height: 1.4;
        }
        #recap h2 {
          font-size: 13px;
        }
      }
      @media (min-width: 601px) and (max-width: 800px) {
        #bossbar {
          width: 210px;
        }
        #recap {
          width: 320px;
        }
      }
      /* Short windows need a side lane: the camera-centered ship stays clear.
         The narrow variant also stays left of the existing minimap. */
      @media (max-height: 450px) {
        #recap {
          width: 210px;
          top: calc(108px + env(safe-area-inset-top, 0px));
          right: 20px;
          left: auto;
          transform: none;
          padding: 10px 14px;
        }
        #recap.in {
          animation: none;
        }
        #recap h2 {
          font-size: 12px;
          letter-spacing: 0.08em;
        }
        #recap .row {
          font-size: 10px;
          letter-spacing: 0.035em;
        }
        #recap .recap-handoff {
          letter-spacing: 0.04em;
        }
      }
      @media (max-height: 450px) and (max-width: 600px) {
        #recap {
          top: auto;
          bottom: calc(14px + env(safe-area-inset-bottom, 0px));
          left: 20px;
          right: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #recap,
        #recap.in,
        #recap .row,
        #recap.in .row:first-of-type,
        #bossbar,
        #bosshp,
        #overlay,
        #pulse {
          animation: none;
          transition: none;
        }
      }
      /* Bigger legible HUD text on touch devices. */
      @media (pointer: coarse) {
        #weapon,
        #shield,
        #boosts,
        #players {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div>
        <div id="weapon">BEAM</div>
        <div id="weaponbar"></div>
        <div id="shield">
          <div id="shieldrow">
            <span>shield</span>
            <span id="shieldtrack"><span id="shieldfill"></span><span id="shieldos"></span></span>
          </div>
          <div id="shieldmod"></div>
          <div id="shieldmodbar"></div>
        </div>
        <div id="boosts"></div>
      </div>
      <div id="hudright">
        <div id="players">connecting&hellip;</div>
        <div id="sector"></div>
      </div>
    </div>
    <div
      id="bossbar"
      hidden
      role="progressbar"
      aria-labelledby="bosslabel"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="100"
    >
      <div id="bosslabel">DREADNOUGHT · PHASE 1</div>
      <div class="track"><div id="bosshp"></div></div>
    </div>
    <div id="recap" hidden></div>
    <div id="pulse" hidden></div>
    <div id="combo">
      <div id="comboval">&times;2 &middot; 3</div>
      <div id="combobar"></div>
    </div>
    <div id="start">
      <h1><img src="/title.webp" width="965" height="158" alt="STARFALL" /></h1>
      <div id="start-controls"></div>
      <div id="start-go"></div>
      <nav id="trial-options" aria-label="Optional weapon trials">
        <span>SOLO WEAPON TRIALS · 20 SECONDS</span>
        <a href="?offline=1&amp;trial=railgun&amp;seed=7319">Railgun alignment</a>
        <a href="?offline=1&amp;trial=glaive&amp;seed=7319">Glaive return path</a>
      </nav>
    </div>
    <aside id="trial-card" hidden aria-label="Weapon trial">
      <div id="trial-title"></div>
      <div id="trial-detail"></div>
      <div id="trial-progress"></div>
      <div id="trial-actions" hidden>
        <a id="trial-retry" href="?offline=1">Retry route</a>
        <a href="?offline=1">Free flight</a>
      </div>
    </aside>
    <script>
      // A trailer capture is pure gameplay, and this is a full-screen title
      // page (STARFALL wordmark, controls card, "press any key to start"):
      // drop it in trailer mode. Must be a classic inline script — /src/main.ts
      // is a module, so it is deferred until after parsing and the browser
      // paints the title for a beat before the lazy trailer director can
      // dismiss it, leaking the wordmark into the opening shot. The director
      // force-starts the run, and the trailer shell's lead-in black covers boot
      // from here on. Presence-check only, so nothing trailer-related loads
      // during normal play.
      if (new URLSearchParams(location.search).has("trailer"))
        document.getElementById("start")?.remove();
    </script>
    <div id="overlay" hidden>
      <div id="recovery-card">
        <div class="recovery-kicker">AUTOMATIC RE-ENTRY</div>
        <div id="destroyed">DESTROYED</div>
