<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Crazy Waymo</title>
    <meta
      name="description"
      content="A runaway robotaxi loose on real San Francisco streets. Pick up fares, catch air, get paid."
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Warm-ink HUD tokens. Every dark stays hue 20-28° (never #000), every
         light is cream (never #fff), gold is reserved for rank/payoff. */
      :root {
        --f:
          "Avenir Next", "SF Pro Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue",
          Arial, sans-serif;
        --fd:
          "Avenir Next Condensed", "Roboto Condensed", "PT Sans Narrow", "Arial Narrow",
          "Helvetica Neue Condensed", ui-rounded, "SF Pro Rounded", var(--f);
        --ink-2: #170e0a;
        --ink-c: rgba(28, 15, 7, 0.93);
        --paper: #fff4e2;
        --dim: rgba(240, 220, 190, 0.66);
        --gold: #ffcf6b;
        --sky-warm: #ffd0a0;
        --kerb-red: #e0453f;
        --boost-blue: #4fc3ff;
        --sea-shallow: #3fc9c4;
        --gain-green: #7ef0a4;
        --r: clamp(8px, 1.5vmin, 18px);
        --ch: clamp(10px, 1.7vmin, 24px);
        --rim: 1.5px;
        /* Chamfer clips — each corner plate cuts the corner pointing INTO frame. */
        --clip-br: polygon(
          0 0,
          100% 0,
          100% calc(100% - var(--ch)),
          calc(100% - var(--ch)) 100%,
          0 100%
        );
        --clip-bl: polygon(0 0, 100% 0, 100% 100%, var(--ch) 100%, 0 calc(100% - var(--ch)));
        --clip-tr: polygon(0 0, calc(100% - var(--ch)) 0, 100% var(--ch), 100% 100%, 0 100%);
        --clip-tl: polygon(var(--ch) 0, 100% 0, 100% 100%, 0 100%, 0 var(--ch));
        --clip-b2: polygon(
          0 0,
          100% 0,
          100% calc(100% - var(--ch)),
          calc(100% - var(--ch)) 100%,
          var(--ch) 100%,
          0 calc(100% - var(--ch))
        );
        --plate-bg: linear-gradient(179deg, #54402f 0%, #3d2b1e 30%, #281a12 66%, #170e0a 100%);
        /* Gradient border: accent-tinted rim-light along the top edge, dark
           die-cut contour along the bottom — a flat `border` reads as a form
           control. */
        --plate-rim: linear-gradient(
          177deg,
          color-mix(in srgb, var(--accent, var(--sky-warm)) 72%, #fff6e6) 0%,
          color-mix(in srgb, var(--accent, var(--sky-warm)) 34%, rgba(255, 226, 186, 0.34)) 16%,
          rgba(150, 112, 74, 0.4) 46%,
          rgba(24, 12, 5, 0.88) 100%
        );
        /* drop-shadow, not box-shadow — box-shadow would square off the chamfer. */
        --plate-shadow: drop-shadow(0 0.16vmin 0.28vmin rgba(20, 10, 4, 0.58))
          drop-shadow(0 1vmin 2vmin rgba(24, 12, 5, 0.48));
        /* 8-offset zero-blur contour ring; 0.039 ≈ 0.055/√2 keeps it round. */
        --ring:
          0.055em 0 0 var(--ink-c), -0.055em 0 0 var(--ink-c), 0 0.055em 0 var(--ink-c),
          0 -0.055em 0 var(--ink-c), 0.039em 0.039em 0 var(--ink-c),
          -0.039em 0.039em 0 var(--ink-c), 0.039em -0.039em 0 var(--ink-c),
          -0.039em -0.039em 0 var(--ink-c), 0 0.07em 0.14em rgba(22, 11, 4, 0.62);
        --ring-s:
          0.07em 0 0 var(--ink-c), -0.07em 0 0 var(--ink-c), 0 0.07em 0 var(--ink-c),
          0 -0.07em 0 var(--ink-c), 0.05em 0.05em 0 var(--ink-c), -0.05em 0.05em 0 var(--ink-c),
          0.05em -0.05em 0 var(--ink-c), -0.05em -0.05em 0 var(--ink-c);
        --e-out: cubic-bezier(0.16, 0.84, 0.44, 1);
        --e-soft: cubic-bezier(0.33, 0, 0.16, 1);
        --e-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink-2);
        color: #fff;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        touch-action: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }

      /* ---- HUD ---- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        font-family: var(--fd);
        font-weight: 700;
        font-variant-numeric: tabular-nums lining-nums;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        /* Contour ring on every HUD text so it survives a bright sky. */
        text-shadow: var(--ring-s);
      }
      /* THE plate, two-layer rim-light: the element paints the gradient RIM,
         ::before paints the body inset by --rim over it. No backdrop blur —
         the solid body replaces it (and it cost GPU on phones). */
      .pill {
        position: fixed;
        background: var(--plate-rim);
        border-radius: var(--r);
        clip-path: var(--clip, none);
        filter: var(--plate-shadow);
        padding: 9px 15px;
        letter-spacing: 1px;
      }
      .pill::before {
        content: "";
        position: absolute;
        inset: var(--rim);
        border-radius: inherit;
        background: var(--plate-bg);
        clip-path: var(--clip, none);
        /* sand bounce from below */
        box-shadow: inset 0 -0.55vmin 1.3vmin rgba(255, 172, 98, 0.16);
        /* the filter makes .pill a stacking context, so this cannot escape */
        z-index: -1;
      }
      .label {
        display: block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        /* matching indent so a centred label doesn't sit half a tracking off */
        text-indent: 0.22em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--accent, var(--sky-warm)) 52%, var(--dim));
      }
      .value {
        display: inline-block;
        min-width: 4.2ch;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.01em;
        color: var(--paper);
        text-shadow: var(--ring);
      }

      /* Current area — persistent, top-center */
      #area {
        --clip: var(--clip-b2);
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        color: color-mix(in srgb, var(--sky-warm) 62%, var(--paper));
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #area.show {
        opacity: 1;
      }

      /* Timer — big, top-center */
      #timer {
        --accent: var(--gold);
        --clip: var(--clip-b2);
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        padding: 6px 22px;
      }
      #timer .value {
        font-size: 46px;
        color: var(--gold);
        line-height: 1;
      }
      #timer.low .value {
        color: var(--kerb-red);
      }
      #timer.low {
        animation: heartbeat 1s ease-in-out infinite;
      }
      @keyframes heartbeat {
        0%,
        60%,
        100% {
          transform: translateX(-50%) scale(1);
        }
        30% {
          transform: translateX(-50%) scale(1.07);
        }
      }

      /* Combo chain meter — under the timer */
      #combo-meter {
        position: fixed;
        top: calc(84px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #combo-meter.show {
        opacity: 1;
      }
      #combo-meter .mult {
        font-size: 18px;
        font-weight: 900;
        font-style: italic;
        color: var(--gold);
        text-shadow: var(--ring-s);
      }
      #combo-track {
        height: 5px;
        border-radius: 3px;
        background: rgba(18, 10, 4, 0.64);
        box-shadow: inset 0 -1px 0 rgba(255, 226, 186, 0.14);
        overflow: hidden;
        margin-top: 3px;
      }
      #combo-fill {
        height: 100%;
        width: 100%;
        background: var(--gold);
      }
      #combo-meter.urgent #combo-fill {
        background: var(--kerb-red);
      }
      #district {
        position: fixed;
        top: calc(120px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        font: 900 italic 22px/1 var(--fd);
        letter-spacing: 1px;
        color: var(--paper);
        white-space: nowrap;
        text-shadow:
          var(--ring),
          0 0 18px rgba(255, 190, 90, 0.45);
        opacity: 0;
        pointer-events: none;
      }
      #time-bonus {
        position: fixed;
        top: calc(78px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        font-size: 30px;
        color: var(--gain-green);
        text-shadow: var(--ring);
        opacity: 0;
        pointer-events: none;
        font-weight: 900;
      }

      /* Score — top-left. The operator accent (Waymo green et al) arrives via
         hud.setOperator writing --accent: rim light + label tint re-skin. */
      #score {
        --clip: var(--clip-br);
        top: calc(14px + env(safe-area-inset-top));
        left: calc(14px + env(safe-area-inset-left));
      }
      #boost-track {
        width: 100px;
        height: 8px;
        border-radius: 5px;
        background: rgba(18, 10, 4, 0.64);
        box-shadow:
          inset 0 1px 2px rgba(14, 7, 3, 0.68),
          inset 0 -1px 0 rgba(255, 226, 186, 0.14);
        overflow: hidden;
        margin-top: 4px;
      }
      #boost-fill {
        height: 100%;
        width: 0%;
        /* boost gold — deliberately NOT a tier colour: banked ≠ earning */
        background: linear-gradient(90deg, var(--paper), #ffc24a);
        transition: width 0.1s linear;
      }
      #speed.denied {
        animation: denyshake 0.16s linear 2;
      }
      #speed.denied #boost-fill {
        background: var(--kerb-red);
      }
      @keyframes denyshake {
        25% {
          transform: translateX(-3px);
        }
        75% {
          transform: translateX(3px);
        }
      }

      /* Mini dash — analogue speedo gauge + boost, bottom-left */
      #speed {
        --accent: var(--kerb-red);
        --clip: var(--clip-tr);
        left: calc(14px + env(safe-area-inset-left));
        bottom: calc(14px + env(safe-area-inset-bottom));
        padding: 7px 10px 7px;
        text-align: center;
      }
      #dash-dial {
        display: block;
        width: 120px;
        height: 84px;
        margin: 0 auto;
      }
      #speed #boost-track {
        margin: 4px auto 0;
      }

      /* Fare card — top-right, only while carrying a passenger */
      #fare-card {
        --accent: var(--boost-blue);
        --clip: var(--clip-bl);
        top: calc(40px + env(safe-area-inset-top));
        right: calc(14px + env(safe-area-inset-right));
        min-width: 150px;
        text-align: right;
        transition:
          opacity 0.2s,
          transform 0.2s;
        opacity: 0;
        transform: translateX(20px);
      }
      #fare-card.show {
        opacity: 1;
        transform: translateX(0);
      }
      #fare-card .who {
        font-size: 13px;
        letter-spacing: 0.14em;
        color: color-mix(in srgb, var(--boost-blue) 62%, var(--paper));
      }
      #fare-card .dist {
        font-size: 22px;
        font-weight: 900;
        min-width: 5ch;
        color: var(--paper);
        text-shadow: var(--ring);
      }
      #patience-track {
        height: 5px;
        border-radius: 3px;
        background: rgba(18, 10, 4, 0.64);
        box-shadow: inset 0 -1px 0 rgba(255, 226, 186, 0.14);
        overflow: hidden;
        margin-top: 6px;
      }
      #patience-fill {
        height: 100%;
        width: 100%;
        background: var(--gain-green);
      }

      /* Combo — center-ish, punchy. Gold: this is the payoff slot. */
      #combo {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translate(-50%, 0) scale(0.6);
        font-size: clamp(26px, 6vw, 60px);
        font-weight: 900;
        font-style: italic;
        color: var(--gold);
        text-shadow:
          var(--ring),
          0 0 18px rgba(255, 160, 40, 0.8);
        opacity: 0;
        pointer-events: none;
        letter-spacing: 1px;
      }

      /* Minor announcements (near-miss, smash, air) — below the major slot */
      #announce-minor {
        position: fixed;
        top: 42%;
        left: 50%;
        transform: translate(-50%, 0);
        font-size: clamp(16px, 3.2vw, 30px);
        font-weight: 900;
        font-style: italic;
        color: var(--paper);
        text-shadow:
          var(--ring),
          0 0 12px rgba(255, 200, 120, 0.4);
        opacity: 0;
        pointer-events: none;
        letter-spacing: 1px;
      }

      /* Itemized dropoff receipt */
      #receipt {
        position: fixed;
        top: 34%;
        right: 12%;
        text-align: right;
        pointer-events: none;
      }
      #receipt div {
        font-size: clamp(16px, 3vw, 28px);
        font-weight: 900;
        font-style: italic;
        letter-spacing: 1px;
        text-shadow: var(--ring);
        margin-top: 2px;
      }

      /* Speed vignette — the ONE allowed cool element in the warm-ink system. */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(8, 6, 14, 0.55) 100%);
      }

      /* Screen-edge drift rails. Peripheral vision resolves motion + colour +
         temporal frequency, not shape — so the charge lives at the edges and
         the tier is triple-encoded: height (fill = ladder position), hue
         (--cc banked / --cn earning, written by hud.ts from fx/tier.ts so
         screen and sparks can never disagree), pulse-rate (.t0/.t1/.t2).
         One composited translateY per frame; opacity damped in JS. */
      .rail {
        position: fixed;
        top: clamp(64px, 15vh, 150px);
        bottom: clamp(64px, 15vh, 150px);
        width: clamp(26px, 4.6vmin, 72px);
        overflow: hidden;
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        --cc: #ffd75e;
        --cn: #4fc3ff;
      }
      #rail-l {
        left: calc(env(safe-area-inset-left, 0px) + 6px);
        -webkit-mask-image: linear-gradient(
          to right,
          #000 0%,
          rgba(0, 0, 0, 0.5) 38%,
          transparent 100%
        );
        mask-image: linear-gradient(to right, #000 0%, rgba(0, 0, 0, 0.5) 38%, transparent 100%);
        transform-origin: left center;
      }
      #rail-r {
        right: calc(env(safe-area-inset-right, 0px) + 6px);
        -webkit-mask-image: linear-gradient(
          to left,
          #000 0%,
          rgba(0, 0, 0, 0.5) 38%,
          transparent 100%
        );
        mask-image: linear-gradient(to left, #000 0%, rgba(0, 0, 0, 0.5) 38%, transparent 100%);
        transform-origin: right center;
      }
      /* Cap/handover stops in PX, not % — the element is full-rail-height and
         translated, so % stops would be % of the whole rail and the banked
         colour would vanish at low fill. Floor alpha 0.58: hue survives a
         blown-out sky. Second layer = warm scrim floor, never fades out. */
      .rail > i {
        position: absolute;
        inset: 0;
        transform: translateY(100%);
        background:
          linear-gradient(
            to bottom,
            rgba(255, 250, 240, 0.98) 0px,
            rgba(255, 250, 240, 0.98) 4px,
            var(--cn) 5px,
            var(--cn) 20px,
            color-mix(in srgb, var(--cn) 55%, var(--cc)) 26px,
            var(--cc) 34px,
            color-mix(in srgb, var(--cc) 90%, transparent) 22%,
            color-mix(in srgb, var(--cc) 74%, transparent) 56%,
            color-mix(in srgb, var(--cc) 58%, transparent) 100%
          ),
          linear-gradient(
            to bottom,
            rgba(24, 13, 5, 0.8) 0%,
            rgba(24, 13, 5, 0.64) 40%,
            rgba(24, 13, 5, 0.5) 100%
          );
        animation: rail-pulse var(--pulse, 1.1s) var(--e-soft) infinite;
      }
      /* Rungs at exactly ⅓ and ⅔, fixed to the frame, over the bar — height
         becomes a COUNT; cream between ink edges survives any backdrop. */
      .rail::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to bottom,
            transparent calc(33.33% - 3px),
            rgba(30, 16, 7, 0.88) calc(33.33% - 3px),
            rgba(30, 16, 7, 0.88) calc(33.33% - 1px),
            rgba(255, 246, 230, 0.96) calc(33.33% - 1px),
            rgba(255, 246, 230, 0.96) calc(33.33% + 1px),
            rgba(30, 16, 7, 0.88) calc(33.33% + 1px),
            rgba(30, 16, 7, 0.88) calc(33.33% + 3px),
            transparent calc(33.33% + 3px)
          ),
          linear-gradient(
            to bottom,
            transparent calc(66.66% - 3px),
            rgba(30, 16, 7, 0.88) calc(66.66% - 3px),
            rgba(30, 16, 7, 0.88) calc(66.66% - 1px),
            rgba(255, 246, 230, 0.96) calc(66.66% - 1px),
            rgba(255, 246, 230, 0.96) calc(66.66% + 1px),
            rgba(30, 16, 7, 0.88) calc(66.66% + 1px),
            rgba(30, 16, 7, 0.88) calc(66.66% + 3px),
            transparent calc(66.66% + 3px)
          );
      }
      /* Tier as temporal frequency. */
      .rail.t0 {
        --pulse: 1.1s;
        --pulse-lo: 0.84;
      }
      .rail.t1 {
        --pulse: 0.7s;
        --pulse-lo: 0.74;
      }
      .rail.t2 {
        --pulse: 0.4s;
        --pulse-lo: 0.6;
      }
      @keyframes rail-pulse {
        0%,
        100% {
          opacity: var(--pulse-lo, 0.84);
        }
        50% {
          opacity: 1;
        }
      }
      /* Tier-up flare. fill-mode none on purpose: a `both` fill would leave a
         standing brightness() compositing pass forever. */
      .rail.pop {
        animation: rail-pop 0.44s var(--e-out);
      }
      @keyframes rail-pop {
        0% {
          transform: scaleX(2.4);
          filter: brightness(2.6);
        }
        100% {
          transform: scaleX(1);
          filter: brightness(1);
        }
      }

      /* Countdown 3-2-1-GO — the gold display ramp; GO! flips it green. */
      #countdown {
        position: fixed;
        top: 34%;
        left: 50%;
        transform: translate(-50%, -50%);
        font: 900 italic clamp(70px, 16vw, 170px) / 1 var(--fd);
        letter-spacing: -0.02em;
        /* clip-text numeral: the inherited ring would paint behind the
           transparent glyphs — the drop-shadow stack is the contour here */
        text-shadow: none;
        background: linear-gradient(180deg, #fffdf6 5%, #ffe7ae 45%, #f7ae3c 84%, #e07c14 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0.014em 0.012em rgba(26, 18, 8, 0.95))
          drop-shadow(0 0.006em 0 rgba(26, 18, 8, 0.9))
          drop-shadow(0 0 0.1em rgba(255, 170, 70, 0.55));
        opacity: 0;
        pointer-events: none;
      }
      #countdown.go {
        background: linear-gradient(180deg, #fdfff6 4%, #d6ffd0 36%, #6fe06a 72%, #1d9c38 100%);
        -webkit-background-clip: text;
        background-clip: text;
      }

      /* Minimap — north-up SF, flush with the bottom-right corner. A canvas
         cannot host ::before, so the plate's rim is the padding ring: the
         bitmap paints the content box and the gradient shows through --rim of
         padding. Chamfer + drop-shadow match the plates. */
      #minimap {
        position: fixed;
        right: calc(14px + env(safe-area-inset-right));
        bottom: calc(14px + env(safe-area-inset-bottom));
        width: 148px;
        height: 148px;
        padding: var(--rim);
        border-radius: var(--r);
        --accent: var(--sea-shallow);
        background: var(--plate-rim);
        clip-path: var(--clip-tl);
        filter: var(--plate-shadow);
        display: none;
        z-index: 5;
        pointer-events: none;
      }
      /* Touch: the pedals own the bottom-right, so the map stacks directly on
         top of the speedo in the bottom-left column. `bottom` clears the
         speedo's ~114px box plus a 10px gutter. */
      @media (pointer: coarse) {
        #minimap {
          width: 104px;
          height: 104px;
          right: auto;
          top: auto;
          left: calc(14px + env(safe-area-inset-left));
          bottom: calc(138px + env(safe-area-inset-bottom));
          clip-path: var(--clip-tr);
        }
        /* Rails end above the thumb zone: a thumb pad is opaque flesh and no
           z-index fixes flesh. */
        .rail {
          top: 10vh;
          bottom: 46vh;
        }
      }
      @media (pointer: coarse) and (max-height: 500px) {
        #minimap {
          width: 96px;
          height: 96px;
        }
      }
      /* Mouse on a narrow window: no pedals, so keep it out of the HUD column. */
      @media (max-width: 720px) and (pointer: fine) {
        #minimap {
          width: 104px;
          height: 104px;
          right: auto;
          bottom: auto;
          left: calc(12px + env(safe-area-inset-left));
          top: calc(170px + env(safe-area-inset-top));
          clip-path: var(--clip-br);
        }
      }

      /* Destination off-screen arrow */
      #dest-arrow {
        position: fixed;
        left: 0;
        top: 0;
        width: 64px;
        height: 64px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        will-change: transform;
      }
      #dest-arrow svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
      }

      /* Center banner: title / game over */
      #banner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        background: radial-gradient(
          ellipse 90% 80% at 50% 42%,
          rgba(26, 15, 9, 0.35),
          rgba(16, 9, 5, 0.78) 82%
        );
      }
      #banner.show {
        opacity: 1;
      }
      #banner-title {
        font: 900 clamp(44px, 11vw, 120px) / 0.95 var(--fd);
        font-style: italic;
        color: var(--gold);
        letter-spacing: -2px;
        text-shadow:
          0 6px 0 rgba(23, 11, 4, 0.45),
          0 0 40px rgba(255, 160, 40, 0.5);
        transform: rotate(-3deg);
      }
      #banner-sub {
        margin-top: 18px;
        font-size: clamp(15px, 3.4vw, 22px);
        color: var(--paper);
        max-width: 80vw;
        line-height: 1.5;
        text-shadow: 0 2px 0 rgba(23, 11, 4, 0.5);
      }
      #banner-stats {
        margin-top: 10px;
        font-size: clamp(13px, 2.6vw, 17px);
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      #banner-cta {
        margin-top: 26px;
        font-size: 15px;
        letter-spacing: 2px;
        color: var(--ink-2);
        background: linear-gradient(180deg, #fff3cc, #ffc84e 58%, #f09a1c);
        border-radius: 10px;
        padding: 12px 22px;
        pointer-events: none;
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(23, 11, 4, 0.4);
        animation: pulse 1.4s ease-in-out infinite;
      }
      #banner.show #banner-cta {
        pointer-events: auto;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.05);
        }
      }

      /* Screen flash overlay */
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 4;
        mix-blend-mode: screen;
      }

      /* Loading */
      /* A trailer capture (?trailer=1) is pure gameplay, and this veil is a
         full-screen title page — it must never open the shot. The class is set
         by the inline script below, so the rule applies from the very first
         style resolution; hiding it from main.ts is seconds too late. */
      html.trailer #loading {
        display: none;
      }
      /* Hiding the veil leaves the live scene — HUD, whatever pose the car
         booted into — on screen for the second or so between world-load and
         the director's first staged frame. The trailer shell's own black plate
         does not exist until runTrailer() runs, so this one covers the gap and
         startTrailer() drops it. Sits just under the shell's z-index. */
      #trailer-plate {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 2147479999;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--ink-2);
        z-index: 20;
        gap: 16px;
      }
      #loading .lt {
        font: 900 italic clamp(34px, 9vw, 80px) / 1 var(--fd);
        color: var(--gold);
        transform: rotate(-3deg);
        letter-spacing: -2px;
      }
      #bar {
        width: min(60vw, 320px);
        height: 10px;
        border-radius: 6px;
        background: rgba(255, 244, 226, 0.12);
        overflow: hidden;
      }
      #bar-fill {
        height: 100%;
        width: 100%;
        background: var(--gold);
        /* scaleX, not width: a width transition is layout and therefore stops
           dead whenever the main thread blocks (the world decode does, for
           seconds). A transform runs on the compositor and keeps moving. */
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.2s;
      }
      #loading .ls {
        font-size: 12px;
        letter-spacing: 2px;
        opacity: 0.6;
      }

      /* Chat pill. 16px is a floor, not a taste: iOS Safari zooms the whole
         page when an input smaller than that takes focus, and it has ignored
         `user-scalable=no` since iOS 10. */
      #chat {
        display: none;
        position: fixed;
        left: 50%;
        bottom: calc(88px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 30;
        width: min(480px, 80vw);
        padding: 10px 16px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        background: rgba(10, 14, 24, 0.88);
        color: #fff;
        font:
          600 16px ui-monospace,
          monospace;
        outline: none;
        pointer-events: auto;
      }

      /* Touch controls */
      #touch {
        position: fixed;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        display: none;
      }
      /* Both must hold: .on = touch device, .play = active run — the buttons
         never float over the title/gameover banner. */
      #touch.on.play {
        display: block;
      }
      .tbtn {
        position: fixed;
        pointer-events: auto;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: #fff;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .tbtn:active {
        background: rgba(255, 209, 71, 0.4);
      }

      /* Pedals: tall rounded slabs with a tread face. Both sit on the same
         bottom edge as the speedo across from them. */
      .pedal {
        position: fixed;
        pointer-events: auto;
        bottom: calc(14px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 10px 0 9px;
        border-radius: 14px / 18px;
        border: 2px solid;
        box-shadow:
          0 5px 0 rgba(0, 0, 0, 0.45),
          inset 0 8px 18px rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        transition:
          transform 0.06s ease,
          box-shadow 0.06s ease;
      }
      /* Press = the pedal travels down onto its shadow. */
      .pedal:active {
        transform: translateY(4px);
        box-shadow:
          0 1px 0 rgba(0, 0, 0, 0.45),
          inset 0 8px 18px rgba(255, 255, 255, 0.12);
      }
      .pedal .tread {
        flex: 1;
        width: 62%;
        border-radius: 4px;
        /* ridged rubber face */
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.4) 0 2px,
          transparent 2px 8px
        );
      }
      .pedal .cap {
        font:
          700 11px/1 ui-monospace,
          monospace;
        letter-spacing: 1.5px;
        color: #fff;
      }
      /* The only pedal — touch drives itself while a finger is down. */
      #t-brake {
        right: calc(14px + env(safe-area-inset-right));
        width: 96px;
        height: 132px;
        background: rgba(255, 90, 82, 0.15);
        border-color: rgba(255, 90, 82, 0.55);
      }

      /* NOS: a small red nitro button riding above the gas pedal. */
      #t-boost {
        right: calc(30px + env(safe-area-inset-right));
        bottom: calc(158px + env(safe-area-inset-bottom));
        width: 64px;
        height: 64px;
        flex-direction: column;
        gap: 1px;
        background: radial-gradient(
          circle at 50% 34%,
          rgba(255, 90, 82, 0.55),
          rgba(150, 20, 16, 0.6)
        );
        border-color: rgba(255, 90, 82, 0.85);
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.42),
          0 0 16px rgba(255, 90, 82, 0.45);
      }
      #t-boost .nos {
        font-size: 26px;
        line-height: 1;
      }
      #t-boost:active {
        transform: translateY(3px);
        background: radial-gradient(circle at 50% 34%, #ff8a80, rgba(200, 30, 24, 0.85));
      }
      /* Chat: a frameless glyph tucked under the EARNED pill, its left edge
         aligned with the pill's. The 44px box stays as the touch target. */
      #t-chat {
        left: calc(14px + env(safe-area-inset-left));
        top: calc(76px + env(safe-area-inset-top));
        width: 44px;
        height: 44px;
        font-size: 22px;
        background: none;
        border: none;
        justify-content: flex-start;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
      }
      #t-chat:active {
        background: none;
        transform: scale(0.92);
        opacity: 0.85;
      }
      /* Narrow phones: shrink the pedal, keep the shared bottom edge. */
      @media (max-width: 420px) {
        #t-brake {
          right: calc(12px + env(safe-area-inset-right));
          width: 82px;
          height: 116px;
        }
        #t-boost {
          right: calc(20px + env(safe-area-inset-right));
          bottom: calc(142px + env(safe-area-inset-bottom));
          width: 56px;
          height: 56px;
        }
      }
      /* Landscape phones: short viewport — a shorter pedal so NOS still clears
         its top edge. Steering is the floating stick, so the left half stays
         free for the map/speedo column. */
      @media (max-height: 500px) {
        #t-brake {
          height: 112px;
        }
        #t-boost {
          bottom: calc(138px + env(safe-area-inset-bottom));
          width: 56px;
          height: 56px;
        }
      }

      @media (max-width: 720px) {
        #timer .value {
          font-size: 34px;
        }
        #combo-meter {
          top: 64px;
        }
        #district {
          top: 132px;
        }
        #receipt {
          top: 40%;
          right: 6%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #banner-cta {
          animation: none;
        }
        #timer.low {
          animation: none;
        }
        .rail > i,
        .rail.pop {
          animation: none;
        }
      }
      /* Landing screen: the banner is the whole screen. Hide every gameplay
         surface behind it — HUD pills, minimap, driver count, touch pad. */
      body.landing #hud,
      body.landing #netinfo,
      body.landing #touch {
        display: none;
      }
      /* Typing suspends driving anyway, and on a portrait phone the chat pill
         sits across the pedal — a tap aimed at the field would brake. Carries
         the `.on.play` classes so it outranks the rule that shows them. */
      body.chatting #touch.on.play {
        display: none;
      }
      /* The shared @repo/embed pause/mute cluster owns the top-right corner on
         a touch device; the cards that live there start below it. */
      @media (pointer: coarse) {
        #netinfo {
          top: calc(76px + env(safe-area-inset-top));
        }
        #fare-card {
          top: calc(98px + env(safe-area-inset-top));
        }
      }
      @media (pointer: coarse) and (max-width: 520px) {
        #area {
          max-width: calc(100vw - 232px);
          padding: 6px 8px;
          font-size: 11px;
          line-height: 1.35;
          letter-spacing: 1.4px;
          white-space: normal;
          text-align: center;
          text-wrap: balance;
        }
      }
      /* Keycap legend, below the CTA. Chips read as keys, not prose; one row
         per input method under the pause overlay's KEYS/TOUCH/PAD tags. */
      #banner-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 30px;
        max-width: min(680px, 92vw);
      }
      #banner-controls:empty {
        display: none;
      }
      #banner-controls .grp {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px 18px;
      }
      #banner-controls .tag {
        font:
          700 10px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 3px;
        color: rgba(255, 207, 107, 0.75);
      }
      #banner-controls .hint {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      #banner-controls kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px;
        height: 26px;
        padding: 0 7px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-bottom-width: 2px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font:
          700 12px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
      }
      #banner-controls .lbl {
        font:
          600 12px/1 system-ui,
          sans-serif;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
      }

      /* Online-drivers count — top-right corner. */
      #netinfo {
        position: fixed;
        top: calc(18px + env(safe-area-inset-top));
        right: calc(14px + env(safe-area-inset-right));
        text-align: right;
        z-index: 5;
        pointer-events: none;
        font:
          12px/1.2 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 2px;
        color: #fff;
        opacity: 0.7;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }
      #netinfo:empty {
        display: none;
      }
    </style>
    <script>
      // Trailer mode, decided before the first paint. A presence check only —
      // nothing from src/trailer/ is pulled into the normal-play bundle.
      if (new URLSearchParams(location.search).has("trailer")) {
        document.documentElement.classList.add("trailer");
        document.addEventListener("DOMContentLoaded", () => {
          const plate = document.createElement("div");
          plate.id = "trailer-plate";
          document.body.appendChild(plate);
        });
      }
    </script>
  </head>
  <body>
    <div id="game"></div>

    <style>
      #garage {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 110px;
        transform: translateX(-50%);
        z-index: 28;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        background: linear-gradient(180deg, rgba(8, 11, 19, 0.97), rgba(14, 18, 30, 0.94));
        border: 1px solid rgba(255, 210, 74, 0.35);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        padding: 18px 22px 14px;
        pointer-events: auto;
        backdrop-filter: blur(6px);
      }
      #garage .gtitle {
        font:
          800 16px ui-monospace,
          monospace;
        color: #ffd24a;
        letter-spacing: 4px;
      }
      #garage .gcards {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: min(94vw, 1120px);
      }
      #garage .gcard {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 172px;
        padding: 12px 10px 10px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: linear-gradient(180deg, #10151f 0%, #161d2c 62%, #212a3d 100%);
        color: #fff;
        cursor: pointer;
        font:
          600 11px ui-monospace,
          monospace;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          box-shadow 0.16s ease;
      }
      #garage .gcard canvas.gprev {
        width: 152px;
        height: 98px;
        border-radius: 10px;
        /* showroom floor: a warm spotlight pooled under the turntable */
        background:
          radial-gradient(
            ellipse 62% 26% at 50% 84%,
            rgba(255, 226, 160, 0.28),
            rgba(255, 226, 160, 0.05) 68%,
            transparent 80%
          ),
          radial-gradient(ellipse at 50% 0%, rgba(140, 170, 255, 0.1), transparent 65%),
          linear-gradient(180deg, #0a0e17 0%, #131a29 70%, #1d2537 100%);
      }
      #garage .gcard b {
        font-size: 12.5px;
        letter-spacing: 2.5px;
        padding-top: 2px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        text-align: center;
      }
      #garage .gcard small {
        opacity: 0.5;
        font-size: 9px;
        text-align: center;
      }
      #garage .gcard span {
        font-size: 10px;
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.05);
      }
      #garage .gcard:not(.owned):not(.on) span {
        color: #ffd24a;
        border-color: rgba(255, 210, 74, 0.35);
      }
      #garage .gcard.on {
        border-color: rgba(255, 210, 74, 0.85);
        box-shadow:
          0 0 0 1px rgba(255, 210, 74, 0.35),
          0 10px 30px rgba(255, 210, 74, 0.08);
        background: linear-gradient(180deg, #171b22 0%, #232637 62%, #2f3349 100%);
      }
      #garage .gcard.on span {
        color: #10141e;
        background: #ffd24a;
        border-color: #ffd24a;
        font-weight: 800;
      }
      #garage .gcard:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 210, 74, 0.6);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      }
      #garage .ghint {
        font:
          600 10px ui-monospace,
          monospace;
        opacity: 0.5;
      }
    </style>
    <input id="chat" maxlength="90" placeholder="say something…" autocomplete="off" />
    <div id="netinfo"></div>
    <div id="hud">
      <div class="rail" id="rail-l" aria-hidden="true"><i></i></div>
      <div class="rail" id="rail-r" aria-hidden="true"><i></i></div>
      <div class="pill" id="timer">
        <span class="label">TIME</span><span class="value">60</span>
      </div>
      <div id="combo-meter">
        <span class="mult"></span>
        <div id="combo-track"><div id="combo-fill"></div></div>
      </div>
      <div id="time-bonus"></div>
      <div class="pill" id="area"></div>
      <div id="district"></div>
      <div class="pill" id="score">
        <span class="label">EARNED</span><span class="value">0</span>
      </div>
      <div class="pill" id="speed">
        <canvas id="dash-dial" aria-hidden="true"></canvas>
        <div id="boost-track"><div id="boost-fill"></div></div>
      </div>
      <div class="pill" id="fare-card">
        <span class="who"></span>
        <div class="dist"></div>
        <div id="patience-track"><div id="patience-fill"></div></div>
      </div>
      <div id="combo"></div>
      <div id="announce-minor"></div>
      <div id="receipt"></div>
      <div id="countdown"></div>
      <canvas id="minimap" aria-hidden="true"></canvas>
      <div id="dest-arrow">
        <svg viewBox="0 0 64 64">
          <polygon
            points="32,4 56,40 32,30 8,40"
            fill="#6bff8e"
            stroke="#0c2414"
            stroke-width="3"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

    <div id="banner" data-gamepad-ignore inert>
      <div id="banner-title">CRAZY WAYMO</div>
      <div id="banner-sub"></div>
      <div id="banner-stats"></div>
      <div id="banner-cta" role="button" tabindex="0" aria-label="Start driving">START DRIVING</div>
      <div id="banner-controls"></div>
    </div>

    <div id="flash"></div>
    <div id="vignette"></div>

    <!-- data-gamepad-ignore: taps here must not anchor the steering stick. -->
    <div id="touch" aria-hidden="true" data-gamepad-ignore>
      <div class="pedal" id="t-brake" role="button" aria-label="Brake and reverse">
        <span class="tread"></span><span class="cap">BRAKE</span>
      </div>
      <div class="tbtn" id="t-boost" role="button" aria-label="Nitro boost">
        <span class="nos">🔥</span>
      </div>
      <div class="tbtn" id="t-chat" role="button" aria-label="Chat">💬</div>
    </div>

    <div id="loading">
      <div class="lt">CRAZY WAYMO</div>
      <div id="bar"><div id="bar-fill"></div></div>
      <div class="ls">Warming up…</div>
    </div>

    <script>
      // The module bundle is megabytes; on a cold mobile load nothing in it
      // runs for seconds, so the bar cannot move and the game reads as hung.
      // Creep to BOOT_CEIL on a timer from HTML parse — the one point that is
      // already executing — and hand over the moment the app calls setLoading.
      (function () {
        var fill = document.getElementById("bar-fill");
        var sub = document.querySelector("#loading .ls");
        if (!fill) return;
        var p = 0;
        var CEIL = 14;
        var t = setInterval(function () {
          // Ease toward the ceiling so it decelerates instead of parking.
          p += (CEIL - p) * 0.08;
          fill.style.transform = "scaleX(" + (p / 100).toFixed(4) + ")";
          if (sub && p > 7) sub.textContent = "Loading game…";
        }, 120);
        window.__bootBar = {
          stop: function () {
            clearInterval(t);
          },
          at: function () {
            return p / 100;
          },
        };
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
