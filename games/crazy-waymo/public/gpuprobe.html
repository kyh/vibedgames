<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crazy Waymo GPU probe</title>
<style>
  body { margin: 0; background: #0b0e14; color: #f4f7fb; font: 15px/1.5 system-ui, sans-serif; }
  #log { padding: 16px; white-space: pre-wrap; word-break: break-word; position: relative; z-index: 1; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.35; }
  .ok { color: #7ee3a5; } .bad { color: #ff8b8b; } .run { color: #ffd15c; }
</style>
<div id="log">Crazy Waymo GPU probe — one rendering feature per step, held for ten seconds each in its own WebGL context.
Screenshot this page when it says DONE, or as soon as a step says LOST.

</div>
<script type="module">
  // The game's floor tier casts no shadows and runs no post pass, yet the
  // Pixel 10's PowerVR driver still loses the context. Each step below holds
  // one of the remaining GPU features the floor tier uses — render targets,
  // BatchedMesh, texture memory, program count — long enough for a loss that
  // lands at a random moment to land.
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";

  const HOLD_S = Number(new URLSearchParams(location.search).get("hold") ?? 10);
  const log = document.querySelector("#log");
  const line = (text, cls = "") => { const el = document.createElement("div"); el.className = cls; el.textContent = text; log.append(el); return el; };
  const nextFrame = () => new Promise((r) => requestAnimationFrame(r));

  const gpu = (() => {
    const c = document.createElement("canvas"); const gl = c.getContext("webgl2");
    if (!gl) return "no WebGL2";
    const i = gl.getExtension("WEBGL_debug_renderer_info");
    const exts = ["WEBGL_multi_draw", "EXT_color_buffer_float", "EXT_color_buffer_half_float", "OES_texture_float_linear"].map((e) => `${e}=${gl.getExtension(e) ? "y" : "n"}`).join(" ");
    return `${i ? gl.getParameter(i.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)} · maxTex ${gl.getParameter(gl.MAX_TEXTURE_SIZE)}\n${exts}`;
  })();
  line(gpu);
  line(`${screen.width}×${screen.height} @${devicePixelRatio} · ${navigator.userAgent.match(/Chrome\/[\d.]+/)?.[0] ?? ""} · hold ${HOLD_S}s`);
  line("");

  const lit = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const box = (s, color, x, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), lit(color)); m.position.set(x, 0.7, z); s.add(m); return m; };
  const noiseTexture = (size) => { const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d"); const img = x.createImageData(size, size); for (let i = 0; i < img.data.length; i += 4) { img.data[i] = Math.random() * 255; img.data[i + 1] = 120 + Math.random() * 100; img.data[i + 2] = 80; img.data[i + 3] = 255; } x.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };
  const screenQuad = (map) => { const s = new THREE.Scene(); s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map }))); const c = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); return { scene: s, camera: c }; };

  const steps = [
    ["1 baseline: 200 lit boxes, fog, ACES", (s, r) => { s.fog = new THREE.Fog(0xdde6f0, 10, 80); r.toneMapping = THREE.ACESFilmicToneMapping; for (let i = 0; i < 200; i++) box(s, 0x88aaff, (i % 20) * 2 - 20, Math.floor(i / 20) * 2 - 10); return () => {}; }],
    ["2 half-float CUBE render target (sky bake style), re-rendered every frame", (s, r) => { for (let i = 0; i < 40; i++) box(s, 0xffaa66, (i % 8) * 3 - 12, Math.floor(i / 8) * 3 - 6); const rt = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType, generateMipmaps: false }); const cam = new THREE.CubeCamera(0.1, 200, rt); s.add(cam); const ball = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 16), new THREE.MeshStandardMaterial({ envMap: rt.texture, roughness: 0, metalness: 1 })); ball.position.y = 2; s.add(ball); s.background = rt.texture; return () => { ball.visible = false; cam.update(r, s); ball.visible = true; }; }],
    ["3 half-float 2D render target, rendered + sampled every frame (post style)", (s, r) => { for (let i = 0; i < 100; i++) box(s, 0x66ffaa, (i % 10) * 2.5 - 12, Math.floor(i / 10) * 2.5 - 10); const rt = new THREE.WebGLRenderTarget(Math.round(innerWidth * 1.5), Math.round(innerHeight * 1.5), { type: THREE.HalfFloatType }); const q = screenQuad(rt.texture); return (cam) => { r.setRenderTarget(rt); r.render(s, cam); r.setRenderTarget(null); r.render(q.scene, q.camera); return true; }; }],
    ["4 DepthTexture render target (float depth), rendered + sampled every frame", (s, r) => { for (let i = 0; i < 100; i++) box(s, 0xff66aa, (i % 10) * 2.5 - 12, Math.floor(i / 10) * 2.5 - 10); const rt = new THREE.WebGLRenderTarget(1024, 1024); rt.depthTexture = new THREE.DepthTexture(1024, 1024, THREE.FloatType); const q = screenQuad(rt.depthTexture); return (cam) => { r.setRenderTarget(rt); r.render(s, cam); r.setRenderTarget(null); r.render(q.scene, q.camera); return true; }; }],
    ["5 BatchedMesh: 3 geometries × 4000 instances, culled + sorted (multi-draw + R32UI/RGBA32F textures)", (s) => { const geos = [new THREE.BoxGeometry(1, 1, 1), new THREE.SphereGeometry(0.6, 8, 6), new THREE.CylinderGeometry(0.4, 0.4, 1.2, 8)]; const verts = geos.reduce((a, g) => a + g.attributes.position.count, 0); const idx = geos.reduce((a, g) => a + g.index.count, 0); const b = new THREE.BatchedMesh(4000, verts, idx, lit(0xaaddff)); b.perObjectFrustumCulled = true; b.sortObjects = true; const ids = geos.map((g) => b.addGeometry(g)); const o = new THREE.Object3D(); for (let i = 0; i < 4000; i++) { const id = b.addInstance(ids[i % 3]); o.position.set((i % 80) * 1.5 - 60, 0.5, Math.floor(i / 80) * 1.5 - 30); o.updateMatrix(); b.setMatrixAt(id, o.matrix); } s.add(b); return () => {}; }],
    ["6 InstancedMesh ×4000 with instanceColor (the no-multi-draw path)", (s) => { const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), lit(0xffffff), 4000); const o = new THREE.Object3D(); const c = new THREE.Color(); for (let i = 0; i < 4000; i++) { o.position.set((i % 80) * 1.5 - 60, 0.5, Math.floor(i / 80) * 1.5 - 30); o.updateMatrix(); m.setMatrixAt(i, o.matrix); m.setColorAt(i, c.setHSL(i / 4000, 0.6, 0.6)); } s.add(m); return () => {}; }],
    ["7 texture memory: 12 × 2048² RGBA textures on screen (~200 MB)", (s) => { for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshStandardMaterial({ map: noiseTexture(2048) })); m.position.set((i % 4) * 7 - 10, 3, Math.floor(i / 4) * 7 - 7); s.add(m); } return () => {}; }],
    ["8 program count: 60 distinct lit materials (map / normal / emissive / alpha combos)", (s) => { const tex = noiseTexture(256); for (let i = 0; i < 60; i++) { const opts = { color: 0xffffff }; if (i & 1) opts.map = tex; if (i & 2) opts.normalMap = tex; if (i & 4) opts.emissiveMap = tex; if (i & 8) opts.alphaTest = 0.5; if (i & 16) opts.vertexColors = true; if (i & 32) opts.flatShading = true; const m = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial(opts)); m.material.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace("#include <dithering_fragment>", `#include <dithering_fragment>\ngl_FragColor.rgb += vec3(${(i / 600).toFixed(4)});`); }; m.material.customProgramCacheKey = () => `p${i}`; m.position.set((i % 10) * 2 - 9, 0.7, Math.floor(i / 10) * 2 - 6); s.add(m); } return () => {}; }],
  ];

  let lastCanvas = null;
  for (const [name, build] of steps) {
    const el = line(`${name} …`, "run");
    const canvas = document.createElement("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    document.body.append(canvas); lastCanvas?.remove(); lastCanvas = canvas;
    let lost = "";
    canvas.addEventListener("webglcontextlost", (e) => { lost = e.statusMessage || "context lost"; });
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdde6f0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(5, 10, 5); scene.add(sun);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), lit(0x556677)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300); camera.position.set(0, 12, 26); camera.lookAt(0, 0, 0);
    try {
      const perFrame = build(scene, renderer);
      let frames = 0;
      const t0 = performance.now();
      while (performance.now() - t0 < HOLD_S * 1000 && !lost) {
        camera.position.x = Math.sin(frames / 90) * 8; camera.lookAt(0, 0, 0);
        if (!perFrame(camera)) renderer.render(scene, camera);
        frames++;
        if (frames % 15 === 0) el.textContent = `${name} … ${((performance.now() - t0) / 1000).toFixed(0)}s, ${frames} frames, ${renderer.info.render.calls} calls, ${renderer.info.render.triangles} tris`;
        await nextFrame();
        if (renderer.getContext().isContextLost()) { lost = lost || "isContextLost"; }
      }
      el.textContent = lost ? `${name} — LOST (${lost}) after ${frames} frames, ${((performance.now() - t0) / 1000).toFixed(1)}s` : `${name} — ok, ${frames} frames in ${HOLD_S}s`;
      el.className = lost ? "bad" : "ok";
      if (lost) break;
    } catch (err) {
      el.textContent = `${name} — THREW ${err?.message ?? err}`; el.className = "bad"; break;
    } finally {
      renderer.dispose();
    }
    await nextFrame(); await nextFrame();
  }
  line("");
  line("DONE — screenshot this.", "ok");
</script>
