<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Pong</title>
    <meta name="description" content="Classic pong reborn in dithered 3D. First to 7 takes it." />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #d4d4d4;
        color: #000;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
          calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      }
      /* The touch pause/mute cluster owns the top-right corner. A narrow screen
         is the only place the centred score reaches it — "You 11 — 11 RIVAL"
         runs under the buttons at 393px — so drop the HUD below it there. */
      @media (pointer: coarse) and (max-width: 480px) {
        #hud {
          padding-top: calc(64px + env(safe-area-inset-top));
        }
      }
      #score {
        font-size: 17px;
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums;
      }
      #score span {
        display: inline-block;
        min-width: 1.2em;
        text-align: center;
        font-weight: 700;
      }
      #score span.pop {
        animation: pop 280ms cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      #netinfo {
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0.55;
      }
      #match-point {
        margin-top: 10px;
        min-height: 14px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      #shot-charge {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
      }
      #shot-charge[hidden] {
        display: none;
      }
      #shot-charge-track {
        width: 64px;
        height: 5px;
        background: #aaa;
        overflow: hidden;
      }
      #shot-charge-fill {
        height: 100%;
        background: #000;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 160ms ease-out;
      }
      #shot-charge-label {
        min-width: 3ch;
      }
      #shot-callout {
        position: fixed;
        bottom: calc(8% + env(safe-area-inset-bottom));
        left: 50%;
        transform: translate(-50%, 6px);
        padding: 7px 11px;
        border: 1px solid #000;
        background: #d4d4d4;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2px;
        white-space: nowrap;
        opacity: 0;
        transition:
          opacity 120ms ease,
          transform 160ms ease;
        pointer-events: none;
      }
      #shot-callout.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .reduced-motion #score span,
      .reduced-motion #combo,
      .reduced-motion #banner,
      .reduced-motion #serve-meter,
      .reduced-motion #shot-charge-fill,
      .reduced-motion #shot-callout {
        animation: none;
        transition: none;
      }
      .reduced-motion #shot-callout {
        transform: translate(-50%, 0);
      }
      @keyframes pop {
        0% {
          transform: scale(1.7);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Rally combo — DOM above the canvas (crisp ink, un-dithered). Size grows
         with the rally via --combo-tier (0→1, set per hit in game-scene). */
      #combo {
        position: fixed;
        top: 27%;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        font-size: calc(20px + var(--combo-tier, 0) * 24px);
        letter-spacing: 2px;
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
      }
      #combo.pop {
        animation: combopop 220ms cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      @keyframes combopop {
        0% {
          transform: scale(1.55);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Serve countdown — drains over the auto-serve dead air (--fill 100%→0). */
      #serve-meter {
        position: fixed;
        bottom: calc(3.5% + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 3px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #serve-meter.on {
        opacity: 0.85;
      }
      #serve-meter::after {
        content: "";
        display: block;
        height: 100%;
        width: var(--fill, 100%);
        margin: 0 auto;
        background: #000;
      }

      /* The action stays at the court edge; rallies have no banner. */
      #banner {
        position: fixed;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 16px;
        width: min(360px, calc(100vw - 24px));
        padding: 8px 10px 8px 14px;
        background: #d4d4d4;
        border: 2px solid #000;
        box-shadow: 3px 3px 0 #000;
        font-weight: 800;
        font-size: 15px;
        line-height: 1.2;
        letter-spacing: 1px;
        pointer-events: auto;
      }
      #banner[hidden] {
        display: none;
      }
      #banner-detail {
        margin-top: 4px;
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      #banner-detail:empty {
        display: none;
      }
      #match-action {
        min-height: 44px;
        border: 2px solid #000;
        background: #000;
        color: #d4d4d4;
        font:
          800 12px ui-monospace,
          monospace;
        letter-spacing: 2px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #match-action {
        grid-column: 2;
        grid-row: 1 / 3;
        min-width: 104px;
        padding: 0 12px;
        box-shadow: 2px 2px 0 #999;
      }
      #match-action:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 #999;
      }
      button:focus-visible {
        outline: 2px dashed #000;
        outline-offset: 4px;
      }
      @media (max-width: 600px) {
        #hud {
          padding-top: calc(68px + env(safe-area-inset-top));
        }
      }
      #point-callout {
        position: fixed;
        top: 24%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 3px;
        pointer-events: none;
      }
      @media (max-height: 500px) {
        #hud {
          padding-top: calc(12px + env(safe-area-inset-top));
        }
        #netinfo {
          display: none;
        }
        #shot-charge {
          margin-top: 4px;
        }
      }
      @media (max-height: 300px) {
        #hud {
          padding-top: calc(18px + env(safe-area-inset-top));
        }
      }

      /* Nothing but the title card before the first serve. */
      body:not(.vg-started) #hud,
      body:not(.vg-started) #camera-panel {
        display: none;
      }

      /* Ink-on-paper skin for @repo/embed's touch pause button — the one
         control that is keyboard-only everywhere else. */
      .vg-touch-controls {
        --vg-touch-bg: #d4d4d4;
        --vg-touch-bg-active: #b3b3b3;
        --vg-touch-fg: #000;
        --vg-touch-border: 2px solid #000;
        --vg-touch-radius: 0;
      }
      .vg-touch-controls button {
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.85);
      }

      /* Webcam hand-tracking panel — the project's core gimmick, framed to feel
         intentional: ink border + hard offset shadow, an inverted label bar, and
         a grayscale feed so it sits in the ink-on-paper palette (the green/red
         hand skeleton on the canvas stays colored as the one live-data accent). */
      #camera-panel {
        padding: 0;
        color: inherit;
        font: inherit;
        position: fixed;
        right: calc(14px + env(safe-area-inset-right));
        bottom: calc(14px + env(safe-area-inset-bottom));
        /* Clamped for phones off the SHORT side: 34vw is right in portrait but
           a landscape phone is 850+px wide, where the full 224px panel covers
           the player's own paddle at full right deflection. */
        width: min(224px, 34vmin);
        aspect-ratio: 4 / 3;
        background: #d4d4d4;
        border: 2px solid #000;
        box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.85);
        overflow: hidden;
        cursor: pointer;
      }
      #camera-panel:focus-visible {
        outline: 3px solid #000;
        outline-offset: 5px;
      }
      /* Narrow (portrait phone): sit above the #serve-meter zone. */
      @media (max-width: 600px) {
        #camera-panel {
          bottom: calc(80px + env(safe-area-inset-bottom));
        }
      }
      /* A landscape phone has no room in the bottom-right: the player's paddle
         sweeps the whole width ~45px off the bottom edge, so the panel moves to
         the top-left — clear of the paddle and of the touch cluster (top-right). */
      @media (orientation: landscape) and (max-height: 500px) {
        #camera-panel {
          top: calc(14px + env(safe-area-inset-top));
          bottom: auto;
          left: calc(14px + env(safe-area-inset-left));
          right: auto;
        }
      }
      /* Tap-minimized, or nothing to preview yet (off / unavailable): the panel
         collapses to a label pill (the ::before label becomes the whole
         control). While live, tracking keeps running behind the pill. */
      #camera-panel[data-min="1"],
      #camera-panel[data-state="off"],
      #camera-panel[data-state="error"] {
        width: auto;
        aspect-ratio: auto;
        height: 44px; /* comfortable touch target */
        display: flex;
        align-items: center;
        padding: 0 14px;
        background: #000;
      }
      #camera-panel[data-min="1"]::before,
      #camera-panel[data-state="off"]::before,
      #camera-panel[data-state="error"]::before {
        position: static;
        padding: 0;
        background: none;
      }
      #camera-panel[data-min="1"] video,
      #camera-panel[data-min="1"] canvas,
      #camera-panel[data-min="1"] #camera-status,
      #camera-panel[data-state="off"] #camera-status,
      #camera-panel[data-state="error"] #camera-status {
        display: none;
      }
      #camera-panel::before {
        content: attr(data-label);
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        background: #000;
        color: #d4d4d4;
        font-size: 10px;
        letter-spacing: 2px;
        padding: 3px 7px;
        pointer-events: none;
      }
      #camera-panel video {
        object-fit: fill; /* fill (not cover) so the whole frame shows and stays aligned with the skeleton canvas */
        display: block;
        width: 100%;
        height: 100%;
        filter: grayscale(1) contrast(1.15);
        transform: scaleX(-1); /* selfie-mirror to match the mirrored paddle mapping */
      }
      #camera-panel canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
      }
      /* Hide the feed until it's live so the other states read as a clean panel. */
      #camera-panel:not([data-state="live"]) video {
        display: none;
      }
      #camera-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 1px;
        color: #000;
        pointer-events: none;
      }
      #camera-panel[data-state="live"] #camera-status {
        top: auto;
        padding: 5px;
        background: #d4d4d4;
        font-size: 10px;
        letter-spacing: 0;
      }
      @media (max-height: 300px) {
        #camera-panel[data-min="1"] {
          width: 82px;
          padding-inline: 4px;
        }
        #camera-panel[data-min="1"]::before {
          letter-spacing: 1px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="score">
        You <span id="score-you">0</span> — <span id="score-ai">0</span>
        <span id="opp-label">AI</span>
      </div>
      <div id="netinfo"></div>
      <div
        id="shot-charge"
        role="progressbar"
        aria-label="Power shot charge"
        aria-valuemin="0"
        aria-valuemax="4"
        aria-valuenow="0"
      >
        <div id="shot-charge-track" aria-hidden="true"><div id="shot-charge-fill"></div></div>
        <span id="shot-charge-label">POWER 0/4</span>
      </div>
      <div id="match-point" role="status"></div>
    </div>
    <div id="combo"></div>
    <div id="point-callout" role="status"></div>
    <div id="shot-callout" role="status"></div>
    <div id="serve-meter"></div>
    <div id="banner" aria-labelledby="banner-title">
      <div id="banner-title"></div>
      <div id="banner-detail"></div>
      <button id="match-action" type="button">SERVE</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
