<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GPU probe</title>
<style>
  body { margin: 0; background: #0b0e14; color: #f4f7fb; font: 15px/1.5 system-ui, sans-serif; }
  #log { padding: 16px; white-space: pre-wrap; word-break: break-word; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.35; }
  .ok { color: #7ee3a5; } .bad { color: #ff8b8b; } .run { color: #ffd15c; }
</style>
<div id="log">GPU probe — one rendering feature per step, each in its own WebGL context.
Screenshot this page when it says DONE.

</div>
<script type="module">
  // Bisects a GPU-process crash by feature: every step builds a fresh
  // renderer, draws ~1.5 s, and records whether the context survived. The
  // step that loses the context (or kills the page) is the driver's limit.
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";

  const log = document.querySelector("#log");
  const line = (text, cls = "") => { const el = document.createElement("div"); el.className = cls; el.textContent = text; log.append(el); };
  const sleepFrames = (n) => new Promise((r) => { let i = 0; const tick = () => (++i >= n ? r() : requestAnimationFrame(tick)); requestAnimationFrame(tick); });

  const gpu = (() => {
    const c = document.createElement("canvas"); const gl = c.getContext("webgl2") ?? c.getContext("webgl");
    if (!gl) return "no WebGL";
    const i = gl.getExtension("WEBGL_debug_renderer_info");
    return `${i ? gl.getParameter(i.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)} · maxTex ${gl.getParameter(gl.MAX_TEXTURE_SIZE)} · ${gl instanceof WebGL2RenderingContext ? "WebGL2" : "WebGL1"}`;
  })();
  line(gpu);
  line(`${screen.width}×${screen.height} @${devicePixelRatio} · ${navigator.userAgent.match(/Chrome\/[\d.]+/)?.[0] ?? ""}`);
  line("");

  const dot = () => { const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d"); const g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); };

  const steps = [
    ["1 plain lit cube (MeshStandardMaterial)", (s) => { s.add(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xffcc66 }))); }],
    ["2 + fog + ACES tone mapping", (s, r) => { s.fog = new THREE.Fog(0xfff0e0, 5, 40); r.toneMapping = THREE.ACESFilmicToneMapping; s.add(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xffcc66 }))); }],
    ["3 InstancedMesh ×600 (lit)", (s) => { const m = new THREE.InstancedMesh(new THREE.SphereGeometry(0.15, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffdd88 }), 600); const o = new THREE.Object3D(); for (let i = 0; i < 600; i++) { o.position.set((i % 30) - 15, 0, Math.floor(i / 30) - 10); o.updateMatrix(); m.setMatrixAt(i, o.matrix); } s.add(m); }],
    ["4 InstancedMesh ×400 transparent, depthWrite off", (s) => { const m = new THREE.InstancedMesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({ color: 0xf4c6c6, transparent: true, opacity: 0.9, depthWrite: false }), 400); const o = new THREE.Object3D(); for (let i = 0; i < 400; i++) { o.position.set((i % 20) - 10, 0, Math.floor(i / 20) - 10); o.updateMatrix(); m.setMatrixAt(i, o.matrix); } s.add(m); }],
    ["5 PCF shadow map 1024 (directional)", (s, r) => { r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap; const l = new THREE.DirectionalLight(0xffffff, 2); l.position.set(5, 10, 5); l.castShadow = true; l.shadow.mapSize.set(1024, 1024); s.add(l); const c = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0xffcc66 })); c.castShadow = true; c.position.y = 1; s.add(c); const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0xeeeeee })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; s.add(g); }],
    ["6 Points + CanvasTexture (motes)", (s) => { const n = 300; const p = new Float32Array(n * 3); for (let i = 0; i < n * 3; i++) p[i] = (Math.random() - 0.5) * 20; const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3)); s.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.5, map: dot(), transparent: true, depthWrite: false }))); }],
    ["7 textured floor (CanvasTexture map, repeat)", (s) => { const t = dot(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(20, 20); const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: t, roughness: 0.95 })); g.rotation.x = -Math.PI / 2; s.add(g); }],
    ["8 everything together, DPR 1.5, no MSAA", (s, r) => { for (const st of steps.slice(0, 7)) st[1](s, r); }],
  ];

  let lastCanvas = null;
  for (const [name, build] of steps) {
    line(`${name} …`, "run");
    const el = log.lastChild;
    const canvas = document.createElement("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    document.body.append(canvas); lastCanvas?.remove(); lastCanvas = canvas;
    let lost = "";
    canvas.addEventListener("webglcontextlost", (e) => { lost = e.statusMessage || "context lost"; });
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0xfff4ea);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x886644, 1.2));
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100); camera.position.set(0, 8, 14); camera.lookAt(0, 0, 0);
    try {
      build(scene, renderer);
      let frames = 0;
      const t0 = performance.now();
      while (performance.now() - t0 < 1500 && !lost) { scene.rotation.y += 0.01; renderer.render(scene, camera); frames++; await sleepFrames(1); if (renderer.getContext().isContextLost()) { lost = lost || "isContextLost"; } }
      el.textContent = lost ? `${name} — LOST (${lost}) after ${frames} frames` : `${name} — ok, ${frames} frames`;
      el.className = lost ? "bad" : "ok";
      if (lost) break;
    } catch (err) {
      el.textContent = `${name} — THREW ${err?.message ?? err}`; el.className = "bad"; break;
    } finally {
      renderer.dispose();
    }
    await sleepFrames(20);
  }
  line("");
  line("DONE — screenshot this.", "ok");
</script>
