<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>Pacman</title>
    <meta
      name="description"
      content="Chomp pellets and outsmart ghosts in a soft plush-clinic maze."
    />
    <style>
      :root {
        --cream: #fdf1e6;
        --ink: #6b5e66;
        --ink-soft: #9d8e96;
        --butter: #f5b942;
        --blush: #f27e9d;
        --card: rgba(255, 255, 255, 0.78);
        --card-edge: rgba(242, 126, 157, 0.25);
        --webcam-width: 192px;
        --round-font:
          ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand, Varela Round,
          system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--cream);
        color: var(--ink);
        font-family: var(--round-font);
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
      }

      /* Soft pink blink when caught — feedback, not punishment. */
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: #f8a8bd;
        opacity: 0;
      }
      #flash.on {
        animation: flash-fade 350ms ease-out forwards;
      }
      @keyframes flash-fade {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 0;
        }
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .pill {
        background: var(--card);
        border: 1.5px solid var(--card-edge);
        padding: 8px 16px;
        border-radius: 999px;
        font: 700 14px/1.3 var(--round-font);
        letter-spacing: 0.04em;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 6px 20px rgba(212, 150, 167, 0.25);
      }
      #score {
        color: var(--butter);
      }
      #best {
        color: var(--ink-soft);
      }
      #stats {
        align-self: center;
        margin-top: auto;
        margin-bottom: 8px;
        font-size: 17px;
        letter-spacing: 2px;
        padding: 9px 20px;
        color: var(--blush);
      }
      #stats:empty {
        display: none;
      }
      #chain {
        align-self: flex-start;
        min-height: 24px;
        margin-top: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--card);
        color: var(--blush);
        font: 700 11px/16px var(--round-font);
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      #chain.active {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #chain {
          transition: none;
        }
      }
      #teaching {
        position: fixed;
        top: calc(80px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(380px, calc(100vw - 32px));
        padding: 9px 16px;
        border: 1.5px solid var(--card-edge);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 6px 20px rgba(212, 150, 167, 0.18);
        text-align: center;
        pointer-events: none;
        font: 600 12px/1.4 var(--round-font);
      }
      #teaching[hidden] {
        display: none;
      }
      .teaching-verbs {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin-bottom: 4px;
      }
      .teaching-verbs span {
        color: var(--ink-soft);
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      .teaching-verbs .done {
        color: #7b8b56;
      }
      @media (max-width: 600px) {
        #stats {
          align-self: flex-start;
          margin-top: 10px;
          margin-bottom: 0;
        }
        #teaching {
          position: static;
          transform: none;
          margin-top: 10px;
        }
      }
      @media (max-height: 520px) {
        #teaching {
          top: calc(70px + env(safe-area-inset-top));
          padding: 6px 12px;
        }
      }
      /* Touch layouts: the bottom strip belongs to the webcam + control pills,
         so lives/pellets dock under the SCORE pill instead — left-aligned, to
         leave the right half of that band to the pause/mute cluster. */
      body.touch #stats {
        align-self: flex-start;
        margin-top: 10px;
        margin-bottom: 0;
      }

      /* Tappable HUD pills — selfie cam + restart, the touch stand-ins for
         SHIFT and R. >=44px targets. */
      #controls {
        position: fixed;
        left: calc(12px + env(safe-area-inset-left));
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 11;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ctl {
        width: 48px;
        height: 48px;
        padding: 0;
        border-radius: 999px;
        background: var(--card);
        border: 1.5px solid var(--card-edge);
        box-shadow: 0 6px 20px rgba(212, 150, 167, 0.25);
        font: 700 20px/1 var(--round-font);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .ctl.on {
        background: var(--butter);
        border-color: rgba(245, 185, 66, 0.6);
      }
      #btn-selfie,
      #btn-restart {
        display: none;
      }
      body.touch #btn-selfie,
      body.touch #btn-restart {
        display: flex;
      }

      /* Centred in the safe area rather than pinned at a fraction of the
         height: a landscape phone is ~390px tall and a top-third anchor ran
         the control card off the fold. */
      #banner {
        position: fixed;
        inset: 0;
        padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }
      #banner.pop {
        animation: banner-pop 450ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes banner-pop {
        from {
          transform: scale(0.72);
        }
        to {
          transform: scale(1);
        }
      }
      #banner-title {
        font: 800 clamp(38px, 7.5vw, 80px)/1.1 var(--round-font);
        letter-spacing: 0.02em;
        color: var(--butter);
        text-shadow:
          0 3px 0 rgba(255, 255, 255, 0.9),
          0 10px 28px rgba(212, 150, 167, 0.45);
      }
      #banner-sub {
        margin: 14px auto 0;
        max-width: 620px;
        padding: 10px 22px;
        display: inline-block;
        background: var(--card);
        border: 1.5px solid var(--card-edge);
        border-radius: 18px;
        font: 600 clamp(13px, 2vw, 16px)/1.5 var(--round-font);
        color: var(--ink);
        box-shadow: 0 6px 20px rgba(212, 150, 167, 0.25);
      }
      #banner-sub:empty {
        display: none;
      }
      /* Title-phase controls teach — hosts the grouped chip card built by
         src/pause-overlay.ts (buildControls), in the same plush pill as
         #banner-sub. Empty (hidden) outside the title phase. */
      #banner-controls {
        margin: 14px auto 0;
        max-width: 620px;
        padding: 14px 22px 13px;
        display: inline-block;
        background: var(--card);
        border: 1.5px solid var(--card-edge);
        border-radius: 18px;
        font-family: var(--round-font);
        box-shadow: 0 6px 20px rgba(212, 150, 167, 0.25);
      }
      #banner-controls:empty {
        display: none;
      }
      /* The pause card stacks its groups (it owns the whole screen); under the
         title they flow side by side so the card never runs off the fold. */
      #banner-controls .pp-groups {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 12px 30px;
      }

      #result {
        width: min(380px, calc(100vw - 32px));
        margin-top: 16px;
        padding: 12px 20px 14px;
        background: rgba(255, 255, 255, 0.88);
        border: 1.5px solid var(--card-edge);
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(212, 150, 167, 0.22);
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }
      #result[hidden] {
        display: none;
      }
      #result.show {
        opacity: 1;
        transform: translateY(0);
      }
      #result-mode {
        font-size: 10px;
        color: var(--ink-soft);
        letter-spacing: 0.1em;
      }
      #result-score {
        display: block;
        font-size: 38px;
        line-height: 1.2;
        color: #946218;
      }
      .result-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 8px;
      }
      .result-stats span {
        display: grid;
        font-size: 10px;
        letter-spacing: 0.03em;
        color: var(--ink);
      }
      .result-stats b {
        font-size: 19px;
        color: var(--ink);
      }
      #banner.has-result #banner-title {
        font-size: clamp(32px, 5.5vw, 64px);
      }
      @media (max-height: 520px) {
        #result {
          margin-top: 10px;
          padding: 8px 16px;
        }
        #result-score {
          font-size: 30px;
        }
        #banner.has-result #banner-sub {
          margin-top: 9px;
          padding: 7px 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #banner.pop,
        #flash.on {
          animation: none;
        }
        #banner,
        #result {
          transition: none;
        }
        #result {
          transform: none;
        }
      }
      @media (max-height: 520px) and (min-width: 600px) {
        #banner {
          padding-right: calc(var(--webcam-width) + 24px + env(safe-area-inset-right));
        }
        #banner.has-result #banner-title {
          font-size: clamp(28px, 4vw, 40px);
        }
        #banner.has-result #result,
        #banner.has-result #banner-sub {
          max-width: 100%;
        }
        body:has(#webcam.collapsed) #banner {
          padding-right: calc(12px + env(safe-area-inset-right));
        }
        #banner-title {
          font-size: clamp(28px, 4vw, 40px);
        }
        #banner-controls {
          max-width: 100%;
          margin-top: 10px;
          padding: 8px 14px;
        }
        #banner-controls .pp-groups {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px 14px;
        }
        #banner-controls .pp-groups > :first-child {
          grid-row: span 2;
        }
        #banner-controls .pp-chip {
          padding: 2px 8px;
        }
        #banner-controls .pp-grid {
          gap: 4px 10px;
        }
      }
      /* Webcam preview — the face IS the controller, so frame it like a
         friendly little porthole. Legacy size kept: 192x144, 384x288 on
         desktop (pointer: fine — a landscape PHONE also matches min-width,
         and 288px would swallow the screen). Tap collapses it to a pill. */
      #webcam {
        position: fixed;
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 10;
        width: var(--webcam-width);
        height: 144px;
        border-radius: 22px;
        background: var(--card);
        border: 3px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 30px rgba(212, 150, 167, 0.4);
        overflow: hidden;
        cursor: pointer;
        transition:
          width 0.2s ease,
          height 0.2s ease;
      }
      #webcam video {
        display: block;
        width: 100%;
        height: auto;
      }
      #webcam-toggle {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: inherit;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      #webcam-toggle:focus-visible {
        outline: 3px solid #b16a81;
        outline-offset: -4px;
      }
      #webcam canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #webcam-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 12px;
        font: 600 11px/1.5 var(--round-font);
        color: var(--ink-soft);
        pointer-events: none;
      }
      @media (min-width: 768px) and (pointer: fine) {
        :root {
          --webcam-width: 384px;
        }
        #webcam {
          height: 288px;
        }
      }
      /* Phone landscape: even the small porthole is a third of the height. */
      @media (pointer: coarse) and (max-height: 520px) {
        :root {
          --webcam-width: 144px;
        }
        #webcam {
          height: 108px;
        }
      }
      #webcam.collapsed {
        width: 56px;
        height: 44px;
      }
      #webcam.collapsed video,
      #webcam.collapsed canvas,
      #webcam.collapsed #webcam-status {
        display: none;
      }
      #webcam-cue {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        pointer-events: none;
      }
      #webcam.collapsed #webcam-cue {
        display: flex;
      }
      #netinfo {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        font:
          11px/1.2 ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 2px;
        color: #fff;
        opacity: 0.7;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }
      #netinfo:empty {
        display: none;
      }
      /* Standings flow inside the HUD column, under the score row: as a second
         fixed top-left corner they stacked straight through the SCORE pill. */
      #board {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        font:
          12px/1.25 ui-monospace,
          Menlo,
          monospace;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        letter-spacing: 1px;
      }
      #board .row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        background: rgba(20, 12, 30, 0.5);
        border-radius: 8px;
        padding: 3px 9px;
      }
      #board .row.me {
        outline: 1px solid rgba(255, 255, 255, 0.5);
      }
      #board:empty {
        display: none;
      }
      #board .sc {
        margin-left: auto;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="flash"></div>
    <div id="netinfo"></div>
    <div id="hud">
      <div class="row">
        <div class="pill" id="score">SCORE 0</div>
        <div class="pill" id="best">BEST 0</div>
      </div>
      <div id="board"></div>
      <div id="chain"></div>
      <div class="pill" id="stats"></div>
      <div id="teaching" hidden aria-live="polite">
        <div class="teaching-verbs">
          <span id="teaching-step">1 · STEP</span><span id="teaching-turn">2 · TURN</span>
        </div>
        <div id="teaching-note"></div>
      </div>
    </div>
    <div id="controls">
      <button class="ctl" id="btn-restart" type="button" aria-label="restart round">↻</button>
      <button
        class="ctl"
        id="btn-selfie"
        type="button"
        aria-label="selfie camera"
        aria-pressed="false"
      >
        🤳
      </button>
    </div>
    <div id="banner">
      <div id="banner-title"></div>
      <div id="result" hidden>
        <div id="result-mode"></div>
        <strong id="result-score">0</strong>
        <div class="result-stats">
          <span><b id="result-best">0</b>BEST</span>
          <span><b id="result-ghosts">0</b>GHOSTS CHOMPED</span>
          <span><b id="result-left">0</b>MAZE LEFT</span>
        </div>
      </div>
      <div id="banner-sub"></div>
      <div id="banner-controls"></div>
    </div>
    <div id="webcam" title="show / hide camera">
      <button
        id="webcam-toggle"
        type="button"
        aria-label="Enable face controls"
        aria-expanded="true"
      >
        <video id="webcam-video" playsinline></video>
        <canvas id="webcam-overlay"></canvas>
        <span id="webcam-status">starting camera…</span>
        <span id="webcam-cue">📷</span>
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
